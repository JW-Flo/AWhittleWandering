<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Fix Test</title>
</head>
<body>
    <h1>Testing CORS Fix</h1>
    <div id="status">Testing...</div>
    <div id="data"></div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const dataDiv = document.getElementById('data');
            
            try {
                statusDiv.textContent = 'Fetching data from API...';
                
                const response = await fetch('https://awhittlewandering-api.kd8jc7v8cd.workers.dev/unified-data');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                statusDiv.textContent = '✅ API Connection Successful!';
                statusDiv.style.color = 'green';
                
                dataDiv.innerHTML = `
                    <h2>API Data Retrieved:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                statusDiv.textContent = `❌ API Connection Failed: ${error.message}`;
                statusDiv.style.color = 'red';
                
                dataDiv.innerHTML = `
                    <h2>Error Details:</h2>
                    <pre>${error.stack}</pre>
                `;
            }
        }
        
        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
