# Cloudflare Workers configuration for Tesla Road Trip MCP Server
name = "tesla-roadtrip-mcp-server"
main = "src/index.js"
compatibility_date = "2024-01-15"

[env.production]
name = "tesla-roadtrip-mcp-server"
routes = [
  { pattern = "mcp.awhittlewandering.com/*", zone_name = "awhittlewandering.com" }
]

[env.development]
name = "tesla-roadtrip-mcp-server-dev"

# Environment variables
[vars]
TESLA_API_BASE = "https://awhittlewandering-api.kd8jc7v8cd.workers.dev"
MCP_SERVER_VERSION = "1.0.0"
CORS_ORIGINS = "*"
