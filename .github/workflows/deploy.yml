name: Deploy Public Site to Cloudflare Pages
on:
  push:
    branches:
      - main
    paths:
      - "48Continental_Starter/public-site/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "48Continental_Starter/public-site/package-lock.json"

      - name: Install dependencies
        run: |
          cd 48Continental_Starter/public-site
          npm ci

      - name: Build site
        run: |
          cd 48Continental_Starter/public-site
          npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Build output directory not found!"
            exit 1
          fi
          echo "Build verification successful."
        working-directory: 48Continental_Starter/public-site

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name continentalusa-site
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: 48Continental_Starter/public-site
