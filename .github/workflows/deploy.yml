name: Deploy Public Site to Cloudflare Pages
on:
  push:
    branches:
      - main
    paths:
      - "48Continental_Starter/public-site/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "48Continental_Starter/public-site/package-lock.json"

      - name: Install dependencies
        run: |
          cd 48Continental_Starter/public-site
          npm ci

      - name: Build site
        run: |
          cd 48Continental_Starter/public-site
          npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_TESSIE_API_TOKEN: ${{ secrets.VITE_TESSIE_API_TOKEN }}
          VITE_EDGE_WORKER_URL: ${{ secrets.VITE_EDGE_WORKER_URL }}
          VITE_AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}

      - name: Verify build output
        run: |
          if [ ! -d "48Continental_Starter/public-site/dist" ]; then
            echo "Error: Build output directory not found!"
            exit 1
          fi
          echo "Build verification successful."
          ls -la 48Continental_Starter/public-site/dist

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ./dist --project-name continentalusa-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: 48Continental_Starter/public-site
