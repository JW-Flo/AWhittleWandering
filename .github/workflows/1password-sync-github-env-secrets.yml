name: Sync 1Password -> GitHub Environment secrets (auto)

on:
  workflow_dispatch:
  schedule:
    # Run once daily (end-of-day-ish UTC). Prefer manual dispatch for immediate updates.
    - cron: "17 23 * * *"

concurrency:
  group: 1password-sync-github-env-secrets
  # Prevent overlap/queue buildup: a new run cancels the previous run.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job needs:
    # - OP_SERVICE_ACCOUNT_TOKEN set as a repository secret (read-only SA token scoped to the AWW vault)
    # - A GitHub App (installed on this repo) whose private key + app id are stored in 1Password (so we don't keep them in GitHub)
    #
    # The GitHub App should have permissions sufficient to:
    # - read/write Actions secrets for environments
    # - trigger workflows (actions:write)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v2

      - name: Load GitHub App credentials from 1Password
        id: op_load
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_APP_ID: op://AWW_SHARED/automation/1PASS_SYNC_APP_ID
          GH_APP_PRIVATE_KEY: op://AWW_SHARED/automation/1PASS_SYNC_PRIVATE_KEY
        with:
          export-env: true

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}

      - name: Sync environment secrets from 1Password item fields
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GITHUB_REPO: ${{ github.repository }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          node ops/secrets/sync-github-env-secrets-from-1password.mjs


