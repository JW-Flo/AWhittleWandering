name: CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write # required for wrangler login
  checks: write # allow junit report annotations

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend, shared]
    env:
      NODE_VERSION: "20"
      PNPM_VERSION: "9"
      # Ensure Wrangler uses staging env on staging branch
      WRANGLER_ENV: ${{ github.ref_name == 'staging' && 'staging' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------- Lint ----------
      - name: Lint
        run: pnpm run lint
        continue-on-error: false

      # ---------- Type-check ----------
      - name: Type-check
        run: pnpm run check-types
        continue-on-error: false

      # ---------- Unit tests ----------
      - name: Test (Vitest)
        run: pnpm run test --recursive --reporter=junit --outputFile=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: results.xml

      # ---------- Build ----------
      - name: Build workspace
        run: pnpm run build --filter ${{ matrix.project }}

      # ---------- Wrangler Publish ----------
      - name: Wrangler publish (staging/preview)
        if: github.ref_name == 'staging' || github.event_name == 'pull_request'
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          npx wrangler deploy --minify --env $WRANGLER_ENV --commit-dirty=true

      # ---------- Upload build artifacts ----------
      - name: Upload build log & dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/dist
            .wrangler
