name: Test Edge Worker
on:
  push:
    paths:
      - "edge-worker/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: edge-worker
        run: npm ci

      - name: Run tests
        working-directory: edge-worker
        run: npm test
