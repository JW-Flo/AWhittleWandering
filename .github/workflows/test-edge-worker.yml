name: Test Edge Worker

on:
  push:
    branches:
      - '**'
      - '!main'  # Don't run on main branch pushes directly
    paths:
      - "edge-worker/**"
      - "!.github/workflows/**"
  pull_request:
    branches:
      - main      # Run on PRs targeting main
    paths:
      - "edge-worker/**"
  workflow_call:  # Allow being called by other workflows
  workflow_dispatch:

# Only use concurrency for direct invocations, not when called by other workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: edge-worker
        run: npm ci

      - name: Setup test environment
        working-directory: edge-worker
        run: |
          echo "TESSIE_API_TOKEN=test_token" > .dev.vars
          echo "EDGE_HMAC_KEY=${{ secrets.EDGE_HMAC_KEY || '48continental_secure_key' }}" >> .dev.vars
          echo "MAPBOX_TOKEN=test_mapbox_token" >> .dev.vars
          echo "OPENWEATHER_API_KEY=test_weather_key" >> .dev.vars

      - name: Build
        working-directory: edge-worker
        run: npm run build

      - name: Run tests
        working-directory: edge-worker
        run: npm test
