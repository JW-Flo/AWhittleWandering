name: Smart Secrets Validation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for validation'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - development
      auto_create:
        description: 'Enable automatic secret creation for missing secrets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # Schedule disabled — re-enable once 1Password SA token (AWW_1PASS_SA) is configured
  # schedule:
  #   - cron: '0 3 * * *'

permissions:
  contents: read
  issues: write  # For creating issues on validation failures

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Install 1Password CLI
        run: |
          curl -sSfLo op.zip https://cache.agilebits.com/dist/1P/op2/pkg/v2.30.0/op_linux_amd64_v2.30.0.zip
          unzip -o op.zip
          sudo mv op /usr/local/bin/
          rm op.zip
          op --version

      - name: Validate secrets from 1Password
        id: validate
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          AUTO_CREATE: ${{ github.event.inputs.auto_create || 'false' }}
        run: |
          chmod +x scripts/validate-secrets.sh
          ./scripts/validate-secrets.sh \
            .github/secrets-config.yml \
            ${{ github.event.inputs.environment || 'production' }}

      - name: Check validation result
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::Secret validation failed!"
          echo "Some required secrets are missing or invalid."
          echo "Review the logs above for details."

      - name: Create issue on failure
        if: steps.validate.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ github.event.inputs.environment || 'production' }}';
            const issueTitle = `Secret Validation Failed - ${environment}`;
            const issueBody = `
            ## Secret Validation Failure
            
            **Environment:** ${environment}
            **Workflow Run:** [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})
            **Triggered:** ${new Date().toISOString()}
            
            ### Details
            The automated secret validation workflow detected missing or invalid secrets.
            
            ### Action Required
            1. Review the workflow logs for specific missing secrets
            2. Add missing secrets to 1Password vault
            3. Re-run the validation workflow to confirm
            
            ### Auto-Creation
            To enable automatic secret creation, run the workflow manually with \`auto_create: true\`.
            
            **Safety:** The auto-creation feature will only create NEW secret fields. It will NOT overwrite existing secrets, preventing any data loss.
            
            **Note:** This issue was automatically created by the scheduled validation workflow.
            `;
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secrets,automation'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes(issueTitle)
            );
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['secrets', 'automation', 'bug']
              });
              console.log('Created new issue for validation failure');
            } else {
              console.log('Issue already exists, skipping creation');
            }

      - name: Validation summary
        if: steps.validate.outcome == 'success'
        run: |
          echo "=========================================="
          echo "✓ Secret Validation Passed"
          echo "=========================================="
          echo "All required secrets are present and valid."
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
