name: Sync Secrets to Cloudflare Workers

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
      - production
    paths:
      - '.github/workflows/sync-secrets.yml'
      - 'config/api-management-system.js'
  schedule:
    # Run daily at 2 AM UTC to verify secrets are still configured
    - cron: '0 2 * * *'

jobs:
  sync-secrets:
    name: Sync GitHub Secrets to Cloudflare Workers
    runs-on: ubuntu-latest
    # Using repository secrets (not environment secrets)
    # If you need environment-specific secrets, add them to GitHub Environments
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Authenticate with Cloudflare
        run: |
          export CLOUDFLARE_API_TOKEN="${{ secrets.Cloudflare_API_token }}"
          wrangler whoami
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.Cloudflare_Account_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.Cloudflare_API_token }}

      - name: Sync TESSIE_API_KEY
        run: |
          if [ -z "${{ secrets.TESSIE_API_KEY }}" ]; then
            echo "⚠️ TESSIE_API_KEY not set in GitHub Secrets"
            exit 1
          fi
          echo "${{ secrets.TESSIE_API_KEY }}" | wrangler secret put TESSIE_API_KEY
        continue-on-error: false

      - name: Sync MAPBOX_API_TOKEN
        run: |
          if [ -z "${{ secrets.MAPBOX_API_TOKEN }}" ]; then
            echo "⚠️ MAPBOX_API_TOKEN not set in GitHub Secrets"
            exit 1
          fi
          echo "${{ secrets.MAPBOX_API_TOKEN }}" | wrangler secret put MAPBOX_API_TOKEN
        continue-on-error: false

      - name: Sync OPENWEATHER_API_KEY
        run: |
          if [ -z "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
            echo "⚠️ OPENWEATHER_API_KEY not set in GitHub Secrets"
            exit 1
          fi
          echo "${{ secrets.OPENWEATHER_API_KEY }}" | wrangler secret put OPENWEATHER_API_KEY
        continue-on-error: false

      - name: Sync JWT_SECRET
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "⚠️ JWT_SECRET not set in GitHub Secrets - skipping"
          else
            echo "${{ secrets.JWT_SECRET }}" | wrangler secret put JWT_SECRET
            echo "✅ JWT_SECRET synced"
          fi
        continue-on-error: true

      - name: Sync TESLA_VIN
        run: |
          if [ -z "${{ secrets.TESLA_VIN }}" ]; then
            echo "⚠️ TESLA_VIN not set in GitHub Secrets - skipping"
          else
            echo "${{ secrets.TESLA_VIN }}" | wrangler secret put TESLA_VIN
            echo "✅ TESLA_VIN synced"
          fi
        continue-on-error: true

      - name: Verify Secrets
        run: |
          cd backend/edge-worker
          wrangler secret list
        continue-on-error: true

      - name: Run API Audit
        run: |
          node config/api-management-system.js audit
        continue-on-error: true
