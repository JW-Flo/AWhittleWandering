name: Sync Secrets to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Sync TESSIE_API_TOKEN
        run: |
          if [ -n "${{ secrets.TESSIE_API_TOKEN }}" ]; then
            echo "Syncing TESSIE_API_TOKEN..."
            printf '%s' "${{ secrets.TESSIE_API_TOKEN }}" | npx wrangler secret put TESSIE_API_TOKEN --env ${{ github.event.inputs.environment || 'production' }}
          else
            echo "TESSIE_API_TOKEN not found in GitHub secrets, skipping..."
          fi

      - name: Sync MAPBOX_API_TOKEN
        run: |
          if [ -n "${{ secrets.MAPBOX_API_TOKEN }}" ]; then
            echo "Syncing MAPBOX_API_TOKEN..."
            printf '%s' "${{ secrets.MAPBOX_API_TOKEN }}" | npx wrangler secret put MAPBOX_API_TOKEN --env ${{ github.event.inputs.environment || 'production' }}
          else
            echo "MAPBOX_API_TOKEN not found in GitHub secrets, skipping..."
          fi

      - name: Sync OPENWEATHER_API_KEY
        run: |
          if [ -n "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
            echo "Syncing OPENWEATHER_API_KEY..."
            printf '%s' "${{ secrets.OPENWEATHER_API_KEY }}" | npx wrangler secret put OPENWEATHER_API_KEY --env ${{ github.event.inputs.environment || 'production' }}
          else
            echo "OPENWEATHER_API_KEY not found in GitHub secrets, skipping..."
          fi

      - name: Sync JWT_SECRET
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "Syncing JWT_SECRET..."
            printf '%s' "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --env ${{ github.event.inputs.environment || 'production' }}
          else
            echo "JWT_SECRET not found in GitHub secrets, skipping..."
          fi

      - name: Sync TESLA_VIN
        run: |
          if [ -n "${{ secrets.TESLA_VIN }}" ]; then
            echo "Syncing TESLA_VIN..."
            printf '%s' "${{ secrets.TESLA_VIN }}" | npx wrangler secret put TESLA_VIN --env ${{ github.event.inputs.environment || 'production' }}
          else
            echo "TESLA_VIN not found in GitHub secrets, skipping..."
          fi