name: Sync Secrets to Cloudflare Workers

on:
  workflow_dispatch:  # Manual trigger (also invoked by 1Password sync workflow)
    inputs:
      target:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
  # NOTE: No schedule here. This is intentionally manual-only to reduce cron noise.
  # It is triggered by the 1Password sync workflow after it updates GitHub Environment secrets.

jobs:
  sync-secrets:
    name: Sync GitHub Secrets to Cloudflare Workers
    runs-on: ubuntu-latest
    # Repo-level secrets only (no GitHub Environments secrets) to keep permissions simple.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Authenticate with Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN not set in GitHub Secrets"
            exit 1
          fi
          case "${{ secrets.CLOUDFLARE_API_TOKEN }}" in
            op://*)
              echo "❌ CLOUDFLARE_API_TOKEN looks like a 1Password reference (op://...). Store the raw token value in 1Password so the sync mirrors real credentials."
              exit 1
              ;;
          esac
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          wrangler whoami
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Wrangler env flag
        id: wrangler_env
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "flag=--env production" >> "$GITHUB_OUTPUT"
          else
            # Wrangler warns if multiple envs exist and you don't specify any target.
            echo "flag=--env \"\"" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync TESSIE_API_TOKEN
        working-directory: backend/edge-worker
        run: |
          if [ -z "${{ secrets.TESSIE_API_TOKEN }}" ]; then
            echo "⚠️ TESSIE_API_TOKEN not set in GitHub Secrets"
            exit 1
          fi
          echo "${{ secrets.TESSIE_API_TOKEN }}" | wrangler secret put TESSIE_API_TOKEN ${{ steps.wrangler_env.outputs.flag }}
        continue-on-error: false

      - name: Sync MAPBOX_API_TOKEN
        working-directory: backend/edge-worker
        run: |
          if [ -z "${{ secrets.MAPBOX_API_TOKEN }}" ]; then
            echo "⚠️ MAPBOX_API_TOKEN not set in GitHub Secrets"
            exit 1
          fi
          echo "${{ secrets.MAPBOX_API_TOKEN }}" | wrangler secret put MAPBOX_API_TOKEN ${{ steps.wrangler_env.outputs.flag }}
        continue-on-error: false

      - name: Sync OPENWEATHER_API_KEY
        working-directory: backend/edge-worker
        run: |
          if [ -z "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
            echo "⚠️ OPENWEATHER_API_KEY not set in GitHub Secrets"
            exit 1
          fi
          echo "${{ secrets.OPENWEATHER_API_KEY }}" | wrangler secret put OPENWEATHER_API_KEY ${{ steps.wrangler_env.outputs.flag }}
        continue-on-error: false

      - name: Sync JWT_SECRET
        working-directory: backend/edge-worker
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "⚠️ JWT_SECRET not set in GitHub Secrets - skipping"
          else
            echo "${{ secrets.JWT_SECRET }}" | wrangler secret put JWT_SECRET ${{ steps.wrangler_env.outputs.flag }}
            echo "✅ JWT_SECRET synced"
          fi
        continue-on-error: true

      - name: Sync TESLA_VIN
        working-directory: backend/edge-worker
        run: |
          if [ -z "${{ secrets.TESLA_VIN }}" ]; then
            echo "⚠️ TESLA_VIN not set in GitHub Secrets - skipping"
          else
            echo "${{ secrets.TESLA_VIN }}" | wrangler secret put TESLA_VIN ${{ steps.wrangler_env.outputs.flag }}
            echo "✅ TESLA_VIN synced"
          fi
        continue-on-error: true

      - name: Verify Secrets
        run: |
          cd backend/edge-worker
          if [ "${{ inputs.target }}" = "production" ]; then
            wrangler secret list --env production
          else
            wrangler secret list
          fi
        continue-on-error: true

      - name: Run API Audit
        run: |
          node config/api-management-system.js audit
        continue-on-error: true
