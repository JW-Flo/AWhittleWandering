name: Sync Secrets to Cloudflare Workers

on:
  schedule:
    # Run daily at 2 AM UTC to keep secrets in sync
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - development

env:
  # Global env for wrangler authentication
  # These secrets are loaded from GitHub Actions secrets and may be overridden by 1Password if available
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/edge-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set vault environment
        id: set_vault_env
        run: |
          if [ "${{ github.event.inputs.environment }}" == "development" ]; then
            echo "VAULT_ENV=dev" >> $GITHUB_OUTPUT
          else
            echo "VAULT_ENV=prod" >> $GITHUB_OUTPUT
          fi

      - name: Pre-validate secrets availability
        continue-on-error: true
        id: pre_validate
        run: |
          echo "Pre-validating secrets availability..."
          # Basic check without full validation
          if [ -n "${{ secrets.AWW_1PASS_SA }}" ]; then
            echo "✓ 1Password service account token available"
            echo "validation_ready=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::1Password service account token not found"
            echo "validation_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Load secrets from 1Password
        continue-on-error: true
        id: load_1password
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          TESSIE_API_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/TESSIE_API_TOKEN
          MAPBOX_API_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/MAPBOX_API_TOKEN
          OPENWEATHER_API_KEY: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/OPENWEATHER_API_KEY
          JWT_SECRET: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/JWT_SECRET
          ADMIN_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/ADMIN_TOKEN
          TESLA_VIN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/TESLA_VIN
          CLOUDFLARE_API_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/CLOUDFLARE_ACCOUNT_ID

      - name: Check 1Password load status
        run: |
          if [ "${{ steps.load_1password.outcome }}" == "success" ]; then
            echo "✓ Secrets loaded successfully from 1Password"
          else
            echo "::warning::1Password secret loading failed. Falling back to GitHub secrets."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify Cloudflare Authentication
        run: |
          echo "Verifying Cloudflare API token..."
          if ! wrangler whoami --env production; then
            echo "::error::Cloudflare authentication failed. Check CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi

      - name: Sync TESSIE_API_TOKEN
        run: |
          if [ -n "$TESSIE_API_TOKEN" ]; then
            echo "Syncing TESSIE_API_TOKEN..."
            printf '%s' "$TESSIE_API_TOKEN" | wrangler secret put TESSIE_API_TOKEN --env production
          else
            echo "::warning::TESSIE_API_TOKEN not found in GitHub secrets, skipping..."
          fi
        env:
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}

      - name: Sync MAPBOX_API_TOKEN
        run: |
          if [ -n "$MAPBOX_API_TOKEN" ]; then
            echo "Syncing MAPBOX_API_TOKEN..."
            printf '%s' "$MAPBOX_API_TOKEN" | wrangler secret put MAPBOX_API_TOKEN --env production
          else
            echo "::warning::MAPBOX_API_TOKEN not found in GitHub secrets, skipping..."
          fi
        env:
          MAPBOX_API_TOKEN: ${{ secrets.MAPBOX_API_TOKEN }}

      - name: Sync OPENWEATHER_API_KEY
        run: |
          if [ -n "$OPENWEATHER_API_KEY" ]; then
            echo "Syncing OPENWEATHER_API_KEY..."
            printf '%s' "$OPENWEATHER_API_KEY" | wrangler secret put OPENWEATHER_API_KEY --env production
          else
            echo "::warning::OPENWEATHER_API_KEY not found in GitHub secrets, skipping..."
          fi
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Sync JWT_SECRET
        run: |
          if [ -n "$JWT_SECRET" ]; then
            echo "Syncing JWT_SECRET..."
            printf '%s' "$JWT_SECRET" | wrangler secret put JWT_SECRET --env production
          else
            echo "::warning::JWT_SECRET not found in GitHub secrets, skipping..."
          fi
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Sync TESLA_VIN
        run: |
          if [ -n "$TESLA_VIN" ]; then
            echo "Syncing TESLA_VIN..."
            printf '%s' "$TESLA_VIN" | wrangler secret put TESLA_VIN --env production
          else
            echo "::warning::TESLA_VIN not found in GitHub secrets, skipping..."
          fi
        env:
          TESLA_VIN: ${{ secrets.TESLA_VIN }}
