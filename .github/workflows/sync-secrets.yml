name: Sync Secrets to Cloudflare Workers

on:
  schedule:
    # Run daily at 2 AM UTC to keep secrets in sync
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - development

env:
  # Global env for wrangler authentication
  # Note: These are also loaded from 1Password in the workflow steps
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: backend/edge-worker
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          TESSIE_API_TOKEN: op://AWW_SHARED/prod/TESSIE_API_TOKEN
          MAPBOX_API_TOKEN: op://AWW_SHARED/prod/MAPBOX_API_TOKEN
          OPENWEATHER_API_KEY: op://AWW_SHARED/prod/OPENWEATHER_API_KEY
          JWT_SECRET: op://AWW_SHARED/prod/JWT_SECRET
          TESLA_VIN: op://AWW_SHARED/prod/TESLA_VIN

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify Cloudflare Authentication
        run: |
          echo "Verifying Cloudflare API token..."
          if ! wrangler whoami --env production; then
            echo "::error::Cloudflare authentication failed. Check CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi

      - name: Sync TESSIE_API_TOKEN
        run: |
          if [ -n "$TESSIE_API_TOKEN" ]; then
            echo "Syncing TESSIE_API_TOKEN..."
            printf '%s' "$TESSIE_API_TOKEN" | wrangler secret put TESSIE_API_TOKEN --env production
          else
            echo "::warning::TESSIE_API_TOKEN not found in GitHub secrets, skipping..."
          fi
        env:
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}

      - name: Sync MAPBOX_API_TOKEN
        run: |
          if [ -n "$MAPBOX_API_TOKEN" ]; then
            echo "Syncing MAPBOX_API_TOKEN..."
            printf '%s' "$MAPBOX_API_TOKEN" | wrangler secret put MAPBOX_API_TOKEN --env production
          else
            echo "::warning::MAPBOX_API_TOKEN not found in GitHub secrets, skipping..."
          fi
        env:
          MAPBOX_API_TOKEN: ${{ secrets.MAPBOX_API_TOKEN }}

      - name: Sync OPENWEATHER_API_KEY
        run: |
          if [ -n "$OPENWEATHER_API_KEY" ]; then
            echo "Syncing OPENWEATHER_API_KEY..."
            printf '%s' "$OPENWEATHER_API_KEY" | wrangler secret put OPENWEATHER_API_KEY --env production
          else
            echo "::warning::OPENWEATHER_API_KEY not found in GitHub secrets, skipping..."
          fi
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Sync JWT_SECRET
        run: |
          if [ -n "$JWT_SECRET" ]; then
            echo "Syncing JWT_SECRET..."
            printf '%s' "$JWT_SECRET" | wrangler secret put JWT_SECRET --env production
          else
            echo "::warning::JWT_SECRET not found in GitHub secrets, skipping..."
          fi
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Sync TESLA_VIN
        run: |
          if [ -n "$TESLA_VIN" ]; then
            echo "Syncing TESLA_VIN..."
            printf '%s' "$TESLA_VIN" | wrangler secret put TESLA_VIN --env production
          else
            echo "::warning::TESLA_VIN not found in GitHub secrets, skipping..."
          fi
        env:
          TESLA_VIN: ${{ secrets.TESLA_VIN }}
