name: Sync Secrets to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-secrets.yml'

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Sync TESSIE_API_TOKEN
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${{ secrets.TESSIE_API_TOKEN }}" ]; then
            echo "Syncing TESSIE_API_TOKEN..."
            npx wrangler secret put TESSIE_API_TOKEN --env production
          else
            echo "TESSIE_API_TOKEN not found in GitHub secrets, skipping..."
          fi

      - name: Sync MAPBOX_API_TOKEN
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${{ secrets.MAPBOX_API_TOKEN }}" ]; then
            echo "Syncing MAPBOX_API_TOKEN..."
            npx wrangler secret put MAPBOX_API_TOKEN --env production
          else
            echo "MAPBOX_API_TOKEN not found in GitHub secrets, skipping..."
          fi

      - name: Sync OPENWEATHER_API_KEY
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
            echo "Syncing OPENWEATHER_API_KEY..."
            npx wrangler secret put OPENWEATHER_API_KEY --env production
          else
            echo "OPENWEATHER_API_KEY not found in GitHub secrets, skipping..."
          fi

      - name: Sync JWT_SECRET
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "Syncing JWT_SECRET..."
            npx wrangler secret put JWT_SECRET --env production
          else
            echo "JWT_SECRET not found in GitHub secrets, skipping..."
          fi

      - name: Sync TESLA_VIN
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${{ secrets.TESLA_VIN }}" ]; then
            echo "Syncing TESLA_VIN..."
            npx wrangler secret put TESLA_VIN --env production
          else
            echo "TESLA_VIN not found in GitHub secrets, skipping..."
          fi

      - name: Verify Secrets
        working-directory: backend/edge-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Verifying synced secrets..."
          npx wrangler secret list --env production

      - name: Run API Audit
        run: |
          echo "Running API connectivity test..."
          curl -s https://awhittlewandering-api.kd8jc7v8cd.workers.dev/api/v1/health || echo "Health check failed"
          curl -s https://awhittlewandering-api.kd8jc7v8cd.workers.dev/api/v1/unified-data || echo "Unified data check failed"