name: Test 1Password Secrets Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (affects vault path: dev/prod)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  test-1password-load:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set vault environment
        id: set_vault_env
        run: |
          ENV_INPUT="${{ github.event.inputs.environment }}"
          if [ "$ENV_INPUT" == "development" ]; then
            echo "VAULT_ENV=dev" >> $GITHUB_OUTPUT
          else
            echo "VAULT_ENV=prod" >> $GITHUB_OUTPUT
          fi

      - name: Load secrets from 1Password
        id: load_secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          SECRET: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/TESSIE_API_TOKEN
          CLOUDFLARE_API_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/CLOUDFLARE_API_TOKEN

      - name: Verify secret loaded (masked)
        run: |
          echo "Testing 1Password secret loading..."
          if [ -z "$SECRET" ]; then
            echo "::error::SECRET was not loaded from 1Password"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN was not loaded from 1Password"
            exit 1
          fi
          echo "✓ Secrets loaded successfully (values are masked)"
          echo "SECRET is set: $([ -n "$SECRET" ] && echo 'Yes' || echo 'No')"
          echo "CLOUDFLARE_API_TOKEN is set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo 'Yes' || echo 'No')"

      - name: Load secrets from env template
        id: load_env_file
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          TESSIE_API_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/TESSIE_API_TOKEN
          MAPBOX_API_TOKEN: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/MAPBOX_API_TOKEN
          JWT_SECRET: op://AWW_SHARED/${{ steps.set_vault_env.outputs.VAULT_ENV }}/JWT_SECRET

      - name: Validate loaded secrets from template
        run: |
          # Check which secrets from template are loaded in environment
          # Only validate the secrets that were loaded in the previous step
          expected_vars=("TESSIE_API_TOKEN" "MAPBOX_API_TOKEN" "JWT_SECRET")

          echo "Validating loaded secrets..."
          missing_vars=()
          for var_name in "${expected_vars[@]}"; do
            # Check if the variable is actually set in the environment
            if [ -z "$(printenv "$var_name" 2>/dev/null)" ]; then
              echo "::error::$var_name is not loaded in environment"
              missing_vars+=("$var_name")
            else
              echo "✓ $var_name is available"
            fi
          done
          
          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "::error::Failed validation: ${#missing_vars[@]} secret(s) missing: ${missing_vars[*]}"
            exit 1
          fi
          
          echo "✓ All expected secrets validated successfully"

      - name: Pipeline test summary
        run: |
          echo "=========================================="
          echo "1Password Secrets Pipeline Test Complete"
          echo "=========================================="
          echo "✓ 1Password load-secrets-action works correctly"
          echo "✓ Service account token (AWW_1PASS_SA) is functional"
          echo "✓ Secrets can be loaded from AWW_SHARED vault"
          echo "✓ Environment template (.env.tpl) is available"
