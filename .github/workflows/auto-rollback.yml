name: Health‑Check & Rollback
on:
  schedule: [{ cron: "*/2 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to update .last_good_deploy on rollback
    steps:
      - uses: actions/checkout@v4
      - name: Ping Health
        id: ping
        run: |
          URL="https://awhittlewandering.com/health"
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo 000)
            [ "$STATUS" = "200" ] && exit 0
            sleep 20
          done
          echo "failing=true" >> $GITHUB_OUTPUT
      - name: Roll Back
        if: steps.ping.outputs.failing == 'true'
        run: |
          echo "Health failed 3× – rolling back"
          DEPLOY_ID=$(cat .last_good_deploy)
          npx wrangler rollback $DEPLOY_ID --env production --yes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
