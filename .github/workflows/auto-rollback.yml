name: Health‑Check & Rollback
on:
  schedule: [{ cron: "*/2 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Health
        id: ping
        run: |
          URL="https://awhittlewandering.com/health"
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo 000)
            [ "$STATUS" = "200" ] && exit 0
            sleep 20
          done
          echo "failing=true" >> $GITHUB_OUTPUT
      - name: Roll Back
        if: steps.ping.outputs.failing == 'true'
        run: |
          DEPLOY_ID=$(cat .last_good_deploy)
          npx wrangler rollback $DEPLOY_ID --env production --yes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Slack Alert
        if: steps.ping.outputs.failing == 'true'
        run: |
          curl -X POST -H "Content-type: application/json" \
            --data '{"text":"🔴 AWW prod health failed 3× – auto‑rolled back."}' \
            $SLACK_ALERT_URL
        env:
          SLACK_ALERT_URL: ${{ secrets.SLACK_ALERT_URL }}
