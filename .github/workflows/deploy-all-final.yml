name: Deploy AWhittleWandering

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "awhittlewandering/package-lock.json"

      - name: Install dependencies
        working-directory: awhittlewandering
        run: npm ci

      - name: Lint
        working-directory: awhittlewandering
        run: npm run lint

      - name: Type check
        working-directory: awhittlewandering
        run: npm run check-types

      - name: Run critical tests
        working-directory: awhittlewandering
        run: npm run test:critical

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "awhittlewandering/package-lock.json"

      - name: Install dependencies
        working-directory: awhittlewandering
        run: npm ci

      - name: Build frontend
        working-directory: awhittlewandering
        run: npm run build:frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          VITE_ENABLE_STREAMING: "true"
          VITE_MAP_RETRY_ATTEMPTS: "3"
          VITE_MAP_RETRY_DELAY: "2000"
          VITE_APP_NAME: "A Whittle Wandering"

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: awhittlewandering/packages/frontend/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "awhittlewandering/package-lock.json"

      - name: Install dependencies
        working-directory: awhittlewandering
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: awhittlewandering/packages/frontend/dist

      - name: Deploy site worker
        working-directory: awhittlewandering
        run: npx wrangler deploy --config wrangler-site.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_API_TOKEN: ${{ secrets.MAPBOX_API_TOKEN }}

      - name: Deploy API worker
        working-directory: awhittlewandering
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Store deployment version
        if: success()
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "$COMMIT_SHA" > .last_good_deploy
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .last_good_deploy
          git commit -m "Update last good deploy to $COMMIT_SHA"
          git push

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify site is up
        run: |
          curl -sSf https://awhittlewandering.com || exit 1
          echo "Website is accessible"

      - name: Verify API endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.awhittlewandering.com/health)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "API is accessible"
          else
            echo "API verification failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Run post-deployment tests
        working-directory: awhittlewandering
        run: npm run test:post-deploy
        env:
          BASE_URL: https://awhittlewandering.com
          API_URL: https://api.awhittlewandering.com

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get last good deployment
        run: |
          LAST_GOOD_DEPLOY=$(cat .last_good_deploy)
          echo "Rolling back to commit $LAST_GOOD_DEPLOY"
          git checkout $LAST_GOOD_DEPLOY

      - name: Deploy previous version
        working-directory: awhittlewandering
        run: |
          npm ci
          npm run build:all
          npx wrangler deploy --config wrangler-site.toml
          npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_API_TOKEN: ${{ secrets.MAPBOX_API_TOKEN }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Notify rollback
        run: |
          echo "Deployment failed, rolled back to previous version"
          # Add notification mechanism here (e.g., Slack, email)
