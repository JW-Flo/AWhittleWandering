name: Deploy All Components (Final)

on:
  push:
    branches:
      - main
    paths:
      - "edge-worker/**"
      - "48Continental_Starter/public-site/**"
      - ".github/workflows/deploy-all-final.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.1.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy Edge Worker
        run: |
          cd edge-worker
          npm ci
          npm install -D wrangler@latest
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAP_API_TOKEN }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}

      - name: Setup Environment Variables
        run: |
          node scripts/setup-env.cjs
        env:
          EDGE_WORKER_URL: "https://thewanderingwhittle-edge.workers.dev"
          API_BASE_URL: "https://thewanderingwhittle-edge.workers.dev"
          MAPBOX_TOKEN: ${{ secrets.MAP_API_TOKEN }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}

      - name: Build & Deploy Public Site
        run: |
          cd 48Continental_Starter/public-site
          npm ci
          npm run build
          npm install -D wrangler@latest
          npx wrangler pages deploy dist --project-name=continentalusa-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deployment Status
        run: |
          echo "✅ Deployment completed"
          echo "Edge Worker: https://thewanderingwhittle-edge.workers.dev"
          echo "Public Site: https://continentalusa-site.pages.dev"
