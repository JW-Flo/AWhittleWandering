name: Deploy All Components (Final)

on:
  push:
    branches:
      - main
      - "recovery/map-integration-restored"
    paths:
      - "edge-worker/**"
      - "48Continental_Starter/public-site/**"
      - ".github/workflows/deploy-all-final.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workflow-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.1.0"

jobs:
  test:
    name: Test Edge Worker
    uses: ./.github/workflows/test-edge-worker.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy Edge Worker
        run: |
          cd edge-worker
          npm ci
          npm install -D wrangler@latest
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAP_API_TOKEN }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}

      - name: Setup Environment Variables
        run: |
          node scripts/setup-env.cjs
        env:
          EDGE_WORKER_URL: "https://thewanderingwhittle-edge.kd8jc7v8cd.workers.dev"
          API_BASE_URL: "https://thewanderingwhittle-edge.kd8jc7v8cd.workers.dev"
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}

      - name: Build & Deploy Public Site
        run: |
          cd 48Continental_Starter/public-site
          npm ci
          npm run build
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          VITE_EDGE_WORKER_URL: "https://thewanderingwhittle-edge.kd8jc7v8cd.workers.dev"
          VITE_API_BASE_URL: "https://thewanderingwhittle-edge.kd8jc7v8cd.workers.dev"
          VITE_WEBSOCKET_ENDPOINT: "wss://thewanderingwhittle-edge.workers.dev/ws"
          VITE_ENABLE_STREAMING: "true"
          VITE_USE_SIMULATED_DATA: "true"
          VITE_OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}
          VITE_APP_NAME: "The Wandering Whittle"

      - name: Create deployment tag
        run: |
          TIMESTAMP=$(date "+%Y%m%d-%H%M%S")
          git tag -a deploy-$TIMESTAMP -m "Deployment $TIMESTAMP"
          git push origin deploy-$TIMESTAMP
