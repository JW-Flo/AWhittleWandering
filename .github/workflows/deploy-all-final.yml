name: Deploy All Components (Final)

on:
  push:
    branches:
      - main
      - "recovery/map-integration-restored"
    paths:
      - "edge-worker/**"
      - "48Continental_Starter/public-site/**"
      - ".github/workflows/deploy-all-final.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workflow-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.1.0"

jobs:
  test:
    name: Test Edge Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: edge-worker
        run: npm ci

      - name: Setup test environment
        working-directory: edge-worker
        run: |
          echo "TESSIE_API_TOKEN=test_token" > .dev.vars
          echo "EDGE_HMAC_KEY=${{ secrets.EDGE_HMAC_KEY || 'awhittlewandering_secure_key' }}" >> .dev.vars
          echo "MAPBOX_TOKEN=test_mapbox_token" >> .dev.vars
          echo "OPENWEATHER_API_KEY=test_weather_key" >> .dev.vars

      - name: Build
        working-directory: edge-worker
        run: npm run build

      - name: Run tests
        working-directory: edge-worker
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy Edge Worker
        run: |
          cd edge-worker
          npm ci
          npm install -D wrangler@latest
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAP_API_TOKEN }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}

      - name: Setup Environment Variables
        run: |
          node scripts/setup-env.cjs
        env:
          EDGE_WORKER_URL: "https://awhittlewandering-edge.kd8jc7v8cd.workers.dev"
          API_BASE_URL: "https://awhittlewandering-edge.kd8jc7v8cd.workers.dev"
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}

      - name: Build & Deploy Public Site
        run: |
          cd 48Continental_Starter/public-site
          npm ci
          npm run build
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          VITE_EDGE_WORKER_URL: "https://awhittlewandering-edge.kd8jc7v8cd.workers.dev"
          VITE_API_BASE_URL: "https://awhittlewandering-edge.kd8jc7v8cd.workers.dev"
          VITE_WEBSOCKET_ENDPOINT: "wss://awhittlewandering-edge.workers.dev/sync-service"
          VITE_ENABLE_STREAMING: "true"
          VITE_USE_SIMULATED_DATA: "false"
          VITE_OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          EDGE_HMAC_KEY: ${{ secrets.EDGE_HMAC_KEY }}
          VITE_APP_NAME: "AWhittleWandering"

      - name: Commit deployment artifacts
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          TIMESTAMP=$(date "+%Y%m%d-%H%M%S")

          # Check if there are changes to commit
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "chore: deploy AWhittleWandering site and edge worker ($TIMESTAMP)"
            # In GitHub Actions we don't push directly to avoid conflicts
            # The changes will be available in the workflow run artifacts
          fi

          # Create and push deployment tag
          git tag -a deploy-$TIMESTAMP -m "Deployment $TIMESTAMP"
          git push origin deploy-$TIMESTAMP
