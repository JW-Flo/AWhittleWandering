name: Validate Secrets Configuration

on:
  workflow_dispatch:  # Manual trigger
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'backend/**'
  schedule:
    # Run every 6 hours to verify secrets are configured
    - cron: '0 */6 * * *'

jobs:
  validate-secrets:
    name: Validate All Secrets Are Configured
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Authenticate with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Avoid implicit `wrangler deploy` (this workflow is validation-only).
          wrangler --version
          wrangler whoami

      - name: Check GitHub Secrets Exist
        run: |
          echo "Checking GitHub Secrets..."
          missing_secrets=()
          
          if [ -z "${{ secrets.TESSIE_API_KEY }}" ]; then
            missing_secrets+=("TESSIE_API_KEY")
          fi
          if [ -z "${{ secrets.MAPBOX_ACCESS_TOKEN }}" ]; then
            missing_secrets+=("MAPBOX_ACCESS_TOKEN")
          fi
          if [ -z "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
            missing_secrets+=("OPENWEATHER_API_KEY")
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            missing_secrets+=("JWT_SECRET")
          fi
          if [ -z "${{ secrets.TESLA_VIN }}" ]; then
            missing_secrets+=("TESLA_VIN")
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            missing_secrets+=("CLOUDFLARE_API_TOKEN")
          fi
          
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "⚠️ Missing GitHub Secrets: ${missing_secrets[*]}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "PR context: not failing the build (secrets are not writable from CI)."
              exit 0
            fi
            echo "Non-PR context: failing so we catch drift."
            exit 1
          else
            echo "✅ All required GitHub Secrets are configured"
          fi

      - name: Check Cloudflare Workers Secrets (Development)
        run: |
          cd backend/edge-worker
          echo "Checking Development environment secrets..."
          wrangler secret list 2>&1 | tee /tmp/dev-secrets.txt
          
          required_secrets=("TESSIE_API_KEY" "MAPBOX_ACCESS_TOKEN" "OPENWEATHER_API_KEY" "JWT_SECRET" "TESLA_VIN")
          missing_in_cf=()
          
          for secret in "${required_secrets[@]}"; do
            if ! grep -q "$secret" /tmp/dev-secrets.txt; then
              missing_in_cf+=("$secret")
            fi
          done
          
          if [ ${#missing_in_cf[@]} -gt 0 ]; then
            echo "⚠️ Missing in Cloudflare (dev): ${missing_in_cf[*]}"
            echo "Run sync-secrets workflow to sync from GitHub Secrets"
          else
            echo "✅ All secrets configured in Cloudflare (dev)"
          fi

      - name: Check Cloudflare Workers Secrets (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          cd backend/edge-worker
          echo "Checking Production environment secrets..."
          wrangler secret list --env production 2>&1 | tee /tmp/prod-secrets.txt
          
          required_secrets=("TESSIE_API_KEY" "MAPBOX_ACCESS_TOKEN" "OPENWEATHER_API_KEY" "JWT_SECRET" "TESLA_VIN")
          missing_in_cf=()
          
          for secret in "${required_secrets[@]}"; do
            if ! grep -q "$secret" /tmp/prod-secrets.txt; then
              missing_in_cf+=("$secret")
            fi
          done
          
          if [ ${#missing_in_cf[@]} -gt 0 ]; then
            echo "⚠️ Missing in Cloudflare (prod): ${missing_in_cf[*]}"
            echo "Run sync-secrets workflow to sync from GitHub Secrets"
          else
            echo "✅ All secrets configured in Cloudflare (prod)"
          fi

      - name: Run API Management Audit
        run: |
          node config/api-management-system.js audit || true
