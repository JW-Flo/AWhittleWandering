name: Codex Smoke (API key + action wiring)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/codex-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OPENAI_API_KEY configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Missing required GitHub Actions secret: OPENAI_API_KEY"
            exit 1
          fi

      - name: Run Codex smoke (read-only)
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt: |
            Return exactly the single token:
            CODEX_SMOKE_OK

      - name: Report result
        env:
          FINAL: ${{ steps.run_codex.outputs.final-message }}
        run: |
          set -euo pipefail
          echo "Codex output: ${FINAL}"
          if [[ "${FINAL}" != *"CODEX_SMOKE_OK"* ]]; then
            echo "Unexpected output from Codex smoke test"
            exit 1
          fi
          echo "## Codex Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${FINAL}" >> "$GITHUB_STEP_SUMMARY"
