# =============================================================================
# Frontend Deployment Workflow
# =============================================================================
# Deploys the React frontend to Cloudflare Pages.
# Includes health checks and rollback guidance.
#
# Environments: preview (PR), staging, production
# =============================================================================

name: Deploy Frontend

on:
  # Preview deployments for PRs (only for previews, not production)
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
  
  # Manual deployment trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - preview
          - staging
          - production

  # Called by other workflows
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  FRONTEND_DIR: frontend
  PAGES_PROJECT: awhittlewandering

jobs:
  # Determine deployment environment
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      branch: ${{ steps.env.outputs.branch }}
      url: ${{ steps.env.outputs.url }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            ENV="${{ inputs.environment }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENV="preview"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
          else
            ENV="preview"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          
          # Set branch and URL based on environment
          case "$ENV" in
            production)
              echo "branch=main" >> $GITHUB_OUTPUT
              echo "url=https://awhittlewandering.com" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "branch=staging" >> $GITHUB_OUTPUT
              echo "url=https://staging.awhittlewandering.pages.dev" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "branch=pr-${{ github.event.pull_request.number || github.run_number }}" >> $GITHUB_OUTPUT
              echo "url=https://pr-${{ github.event.pull_request.number || github.run_number }}.awhittlewandering.pages.dev" >> $GITHUB_OUTPUT
              ;;
          esac

  # Build the frontend
  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd shared && npm ci || npm install
          cd ../${{ env.FRONTEND_DIR }} && npm ci || npm install

      - name: Build Shared Schemas
        run: |
          cd shared
          npm run build || echo "No build script"

      - name: Build Frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          # Set environment-specific variables
          VITE_API_URL: ${{ needs.setup.outputs.environment == 'production' && 'https://api.awhittlewandering.com' || 'https://awhittlewandering-api-staging.kd8jc7v8cd.workers.dev' }}
        run: npm run build

      - name: Remove _redirects from build output
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          # SPA fallback is handled in Worker code (src/spa-worker.ts).
          # Shipping _redirects causes Cloudflare error 10021 (infinite loop).
          rm -f dist/_redirects
          echo "Cleaned _redirects from build output"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ needs.setup.outputs.environment }}
          path: ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 7

  # Deploy to Cloudflare Pages
  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ needs.setup.outputs.environment }}
          path: ${{ env.FRONTEND_DIR }}/dist/

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="${{ needs.setup.outputs.branch }}"
          LOG_DIR="${RUNNER_TEMP}/wrangler-logs"
          mkdir -p "$LOG_DIR"

          # Capture output and exit code separately
          set +e  # Temporarily disable exit on error
          OUTPUT=$(wrangler pages deploy dist \
            --project-name=${{ env.PAGES_PROJECT }} \
            --branch="$BRANCH" \
            --commit-hash="${{ github.sha }}" \
            --commit-message="${{ github.event.head_commit.message || 'Manual deployment' }}" \
            2>&1)
          EXIT_CODE=$?
          set -e  # Re-enable exit on error

          # Persist full log (redact tokens)
          echo "$OUTPUT" | sed -E 's/(Bearer |token=|CLOUDFLARE_API_TOKEN=)[^ ]*/\1[REDACTED]/g' > "$LOG_DIR/deploy-frontend.log"
          echo "log_dir=$LOG_DIR" >> $GITHUB_OUTPUT

          echo "$OUTPUT"

          # Check if deployment failed
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Deployment failed with exit code $EXIT_CODE"

            # Emit GitHub annotations for known error patterns
            echo "$OUTPUT" | grep -n "10021" && echo "::error file=frontend/wrangler.toml::Cloudflare error 10021: _redirects infinite loop. Remove _redirects and use Worker SPA fallback."
            echo "$OUTPUT" | grep -ni "authentication" && echo "::error::Cloudflare authentication failure. Check CLOUDFLARE_API_TOKEN secret."
            echo "$OUTPUT" | grep -ni "missing binding" && echo "::error::Missing Cloudflare binding. Check wrangler.toml configuration."
            echo "$OUTPUT" | grep -ni "rate limit" && echo "::warning::Cloudflare rate limit hit. Retry in a few minutes."

            # Print last 200 lines for quick diagnosis
            echo "--- Last 200 lines of deploy log ---"
            tail -200 "$LOG_DIR/deploy-frontend.log"

            exit $EXIT_CODE
          fi

          # Extract deployment URL
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | head -1 || echo "${{ needs.setup.outputs.url }}")
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

          # Extract deployment ID if available
          DEPLOYMENT_ID=$(echo "$OUTPUT" | grep -oP '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1 || echo "unknown")
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Upload deploy logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-logs-${{ github.run_number }}
          path: ${{ steps.deploy.outputs.log_dir || runner.temp }}/wrangler-logs/
          retention-days: 14

  # Health check
  health-check:
    needs: [setup, deploy]
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
    steps:
      - name: Wait for Deployment Propagation
        run: sleep 30

      - name: Health Check
        id: check
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          MAX_RETRIES=5
          RETRY_DELAY=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES for $URL..."
            
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            # Normalize HTTP code (curl may return 000000 instead of 000 on connection failure)
            HTTP_CODE=${HTTP_CODE:0:3}
            
            echo "HTTP Code: $HTTP_CODE"
            
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ Health check passed"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [[ $i -lt $MAX_RETRIES ]]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          echo "healthy=false" >> $GITHUB_OUTPUT
          exit 1

  # Comment on PR with preview URL
  comment-preview:
    needs: [setup, deploy, health-check]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const healthy = '${{ needs.health-check.outputs.healthy }}' === 'true';
            const url = '${{ needs.deploy.outputs.url }}';
            
            const body = healthy
              ? `## 🚀 Frontend Preview Deployed\n\n**URL:** ${url}\n\n✅ Health check passed`
              : `## ⚠️ Frontend Preview Deployed (with issues)\n\n**URL:** ${url}\n\n❌ Health check failed - please verify manually`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Frontend Preview')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # Notify on failure
  notify-failure:
    needs: [setup, deploy, health-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create Failure Issue
        if: needs.setup.outputs.environment == 'production'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Frontend Deployment Failed - ${{ needs.setup.outputs.environment }}`,
              body: `## Frontend Deployment Failure
              
              **Environment:** ${{ needs.setup.outputs.environment }}
              **URL:** ${{ needs.deploy.outputs.url }}
              **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              
              ### Rollback Instructions
              1. Go to Cloudflare Dashboard → Pages → ${{ env.PAGES_PROJECT }}
              2. Navigate to Deployments
              3. Find the last working deployment
              4. Click "Rollback to this deployment"
              
              /cc @${{ github.actor }}
              `,
              labels: ['incident', 'frontend', 'deployment-failure']
            });
