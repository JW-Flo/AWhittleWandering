name: agent-pack
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/bootstrap-agent-pack.sh
      - run: |
          git diff --exit-code || (echo "Agent pack drift. Run scripts/bootstrap-agent-pack.sh and commit results." && exit 1)
