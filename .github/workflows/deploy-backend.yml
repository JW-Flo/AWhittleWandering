# Deploy Backend (Cloudflare Workers)
#
# Fixes:
# - Staging secrets and deploy now both use `--env staging`
#
name: deploy-backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      skip_tests:
        description: "Skip tests/typecheck before deploy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  WORKER_DIR: backend/edge-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (root + worker)
        run: |
          npm ci || npm install
          cd "${{ env.WORKER_DIR }}" && npm ci || npm install

      - name: Tests/typecheck (optional)
        if: inputs.skip_tests != true
        run: |
          bash scripts/preflight.sh

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Configure secrets (env-scoped)
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          MAPBOX_API_TOKEN: ${{ secrets.MAPBOX_API_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TESLA_VIN: ${{ secrets.TESLA_VIN }}
        run: |
          set -euo pipefail

          ENV="${{ inputs.environment }}"
          ENV_FLAG="--env $ENV"

          # Set secrets only if provided (never echo values)
          if [[ -n "${TESSIE_API_TOKEN:-}" ]]; then
            printf '%s' "$TESSIE_API_TOKEN" | wrangler secret put TESSIE_API_TOKEN $ENV_FLAG >/dev/null
          fi
          if [[ -n "${MAPBOX_API_TOKEN:-}" ]]; then
            printf '%s' "$MAPBOX_API_TOKEN" | wrangler secret put MAPBOX_API_TOKEN $ENV_FLAG >/dev/null
          fi
          if [[ -n "${OPENWEATHER_API_KEY:-}" ]]; then
            printf '%s' "$OPENWEATHER_API_KEY" | wrangler secret put OPENWEATHER_API_KEY $ENV_FLAG >/dev/null
          fi
          if [[ -n "${JWT_SECRET:-}" ]]; then
            printf '%s' "$JWT_SECRET" | wrangler secret put JWT_SECRET $ENV_FLAG >/dev/null
          fi
          if [[ -n "${TESLA_VIN:-}" ]]; then
            printf '%s' "$TESLA_VIN" | wrangler secret put TESLA_VIN $ENV_FLAG >/dev/null
          fi

      - name: Build worker
        working-directory: ${{ env.WORKER_DIR }}
        run: npm run build

      - name: Deploy worker (env-scoped)
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --env "${{ inputs.environment }}"

