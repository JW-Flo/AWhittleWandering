name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/edge-worker/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/edge-worker/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # =====================================================
  # Security & Quality Checks
  # =====================================================
  security-scan:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Secret scanning
        run: |
          echo "Scanning for hardcoded secrets..."
          # Check for common secret patterns
          if grep -r -E "(TESSIE_API_TOKEN|JWT_SECRET|MAPBOX_TOKEN|CLOUDFLARE_API_TOKEN)\s*=\s*['\"]?[a-zA-Z0-9_-]{20,}" backend/edge-worker/src/; then
            echo "❌ SECURITY ALERT: Hardcoded secrets detected!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check for database IDs in code
        run: |
          echo "Checking for hardcoded database IDs in source code..."
          if grep -r "database_id" backend/edge-worker/src/ 2>/dev/null; then
            echo "⚠️  Warning: database_id found in source code"
          fi
          echo "✅ Source code check complete"

  # =====================================================
  # Linting & Type Checking
  # =====================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/edge-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/edge-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation
        run: npx tsc --noEmit

      - name: Lint check (if configured)
        run: npm run lint --if-present
        continue-on-error: true

  # =====================================================
  # Unit & Integration Tests
  # =====================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/edge-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/edge-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Test CSV parser
        run: npm test -- tests/importers/tesla-csv.test.ts
        env:
          NODE_ENV: test

  # =====================================================
  # Database Migration Check
  # =====================================================
  migration-check:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    needs: [security-scan, lint]
    defaults:
      run:
        working-directory: ./backend/edge-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check migration syntax
        run: |
          echo "Validating SQL migration syntax..."
          for file in migrations/*.sql; do
            echo "Checking $file..."
            # Basic syntax validation (SQLite)
            if ! grep -q "CREATE TABLE\|ALTER TABLE\|DROP TABLE\|CREATE INDEX" "$file"; then
              echo "⚠️  Warning: $file may not contain valid SQL DDL"
            fi
          done
          echo "✅ Migration syntax check complete"

  # =====================================================
  # Deploy to Staging (PR or develop branch)
  # =====================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test, migration-check]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://awhittlewandering-api-dev.workers.dev
    defaults:
      run:
        working-directory: ./backend/edge-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/edge-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations (development)
        run: |
          npx wrangler d1 migrations apply journey-prod --env development --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

      - name: Deploy to Cloudflare Workers (staging)
        run: npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test staging deployment
        run: |
          echo "Running smoke tests against staging..."
          STAGING_URL="https://awhittlewandering-api-dev.workers.dev"

          # Test health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/v1/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Health check passed"

          # Test config endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/v1/config")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Config endpoint failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Config endpoint passed"

          echo "✅ All smoke tests passed"

  # =====================================================
  # Deploy to Production (main branch only)
  # =====================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test, migration-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.awhittlewandering.com
    defaults:
      run:
        working-directory: ./backend/edge-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/edge-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run D1 migrations (production)
        run: |
          npx wrangler d1 migrations apply journey-prod --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers (production)
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test production deployment
        run: |
          echo "Running smoke tests against production..."
          PROD_URL="https://api.awhittlewandering.com"

          # Test health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/v1/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Production health check failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Production health check passed"

          # Test config endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/v1/config")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Production config endpoint failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Production config endpoint passed"

          echo "✅ All production smoke tests passed"

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "API is live at https://api.awhittlewandering.com"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Please check the logs and roll back if necessary"
          exit 1
