name: 1Password Load Secrets Example

# This workflow demonstrates how to use 1Password's load-secrets-action
# with the AWW_1PASS_SA service account token to load secrets from 1Password

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load secret
        id: load_secrets
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          SECRET: op://AWW_SHARED/prod/TESSIE_API_TOKEN

      - name: Print masked secret
        run: 'echo "Secret: $SECRET"'
        # Prints: Secret: ***

      - name: Load multiple secrets from template
        id: load_env
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.AWW_1PASS_SA }}
          TESSIE_API_TOKEN: op://AWW_SHARED/prod/TESSIE_API_TOKEN
          MAPBOX_API_TOKEN: op://AWW_SHARED/prod/MAPBOX_API_TOKEN
          CLOUDFLARE_API_TOKEN: op://AWW_SHARED/prod/CLOUDFLARE_API_TOKEN

      - name: Use loaded secrets
        run: |
          echo "Secrets are now available as environment variables"
          echo "TESSIE_API_TOKEN is set: $([ -n "$TESSIE_API_TOKEN" ] && echo 'Yes' || echo 'No')"
          echo "MAPBOX_API_TOKEN is set: $([ -n "$MAPBOX_API_TOKEN" ] && echo 'Yes' || echo 'No')"
          echo "CLOUDFLARE_API_TOKEN is set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo 'Yes' || echo 'No')"
          echo "All secrets are masked in logs for security"

      - name: Reference env template
        run: |
          echo "Environment template available at: tests/.env.tpl"
          echo "This template defines all available secrets in 1Password format"
          cat tests/.env.tpl
