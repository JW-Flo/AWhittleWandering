name: Minimal Site Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_site_only:
        description: "Just deploy the site without any extra validation or checks"
        type: boolean
        default: true

jobs:
  deploy-site:
    name: Deploy Public Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & deploy
        working-directory: 48Continental_Starter/public-site
        run: |
          # Install dependencies
          bun install

          # Build the site (note: using fallback mapbox token if not available)
          bun run build

          # Install wrangler
          bun install -g wrangler

          # Deploy to Cloudflare Pages
          echo "Deploying to Cloudflare Pages..."
          npx wrangler pages deploy dist --project-name="awhittlewandering-site" --branch="main"
        env:
          # Cloudflare credentials
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

          # Required for building the site
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || 'pk.eyJ1IjoidGVzdC11c2VyIiwiYSI6ImNrNm13bXFpcjFnOGwzbm13YWF6MjQ3dWkifQ.YQ9JOBc4el6sT-4DFqroEQ' }}
          VITE_USE_SIMULATED_DATA: "true"

      - name: Verify site is live
        run: |
          echo "✅ Site deployment initiated! It should be available at https://awhittlewandering-site.pages.dev in a few minutes."
