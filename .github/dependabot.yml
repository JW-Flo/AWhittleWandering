# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  # Enable version updates for devcontainers
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # Enable version updates for npm packages in root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Enable version updates for npm packages in public-site
  - package-ecosystem: "npm"
    directory: "/48Continental_Starter/public-site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Enable version updates for npm packages in awhittlewandering
  - package-ecosystem: "npm"
    directory: "/awhittlewandering"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Enable version updates for npm packages in edge-worker
  - package-ecosystem: "npm"
    directory: "/edge-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Enable version updates for npm packages in mcp-server
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
