# Secrets Configuration
# Defines required secrets across all environments for automated validation

version: 1

# Secret definitions with their sources and validation rules
secrets:
  # Core API Secrets
  - name: TESSIE_API_TOKEN
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: token
      min_length: 32

  - name: MAPBOX_API_TOKEN
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: token
      pattern: "^pk\\."

  - name: OPENWEATHER_API_KEY
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: api_key
      min_length: 32

  # Cloudflare Secrets
  - name: CLOUDFLARE_API_TOKEN
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: token
      min_length: 40

  - name: CLOUDFLARE_ACCOUNT_ID
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: id
      pattern: "^[a-f0-9]{32}$"

  # Authentication Secrets
  - name: JWT_SECRET
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: secret
      min_length: 64

  - name: ADMIN_TOKEN
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: token
      min_length: 32

  # Vehicle Data
  - name: TESLA_VIN
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: true
    validation:
      type: vin
      pattern: "^[A-HJ-NPR-Z0-9]{17}$"

  # Optional Services
  - name: NOTIFICATION_WEBHOOK
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: url
      pattern: "^https://"

  - name: SPOTIFY_CLIENT_ID
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: client_id
      min_length: 32

  - name: SPOTIFY_CLIENT_SECRET
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: secret
      min_length: 32

  - name: TAVILY_API_KEY
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: api_key
      min_length: 32

  - name: SERPER_API_KEY
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: api_key
      min_length: 32

  - name: BRAVE_API_KEY
    source: 1password
    vault: AWW_SHARED
    environments:
      production: prod
      development: dev
    required: false
    validation:
      type: api_key
      min_length: 32

# Notification settings
notifications:
  on_failure:
    - type: github_issue
      enabled: true
      labels: ["secrets", "automation"]
    - type: workflow_warning
      enabled: true

# Auto-creation settings
auto_create:
  enabled: false  # Set to true to enable automatic secret creation
  default_generator: secure_random
  notify_on_creation: true
