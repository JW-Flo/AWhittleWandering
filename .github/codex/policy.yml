# =============================================================================
# Codex Autonomous CI/CD Pipeline Policy
# =============================================================================
# This file defines the complete policy for the autonomous AI pipeline,
# including path permissions, risk classification, and auto-merge rules.
#
# Version: 2.0
# =============================================================================

version: "2.0"

# -----------------------------------------------------------------------------
# Path Classification
# -----------------------------------------------------------------------------
# Defines which paths are allowed for different types of changes

paths:
  # Runtime code paths - where the agent can make code changes
  runtime_code:
    - "backend/"
    - "frontend/"
    - "shared/"
  
  # Documentation-only paths - lower risk, can auto-merge
  docs_only:
    - "docs/"
    - "*.md"
    - "!.ai/*.md"  # Exclude AI config from docs-only
  
  # Configuration paths - medium risk
  config:
    - ".github/workflows/"
    - ".github/codex/"
    - "ops/"
    - "scripts/"
  
  # Restricted paths - agent cannot modify
  restricted:
    - ".env*"
    - "ops/secrets/"
    - "**/wrangler.toml"
    - "**/credentials*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"

# -----------------------------------------------------------------------------
# Risk Classification Rules
# -----------------------------------------------------------------------------
# Determines risk level based on changed paths and patterns

risk_classification:
  # Low risk - safe for auto-merge
  low:
    conditions:
      - only_docs_changed: true
      - file_count_max: 3
      - lines_changed_max: 100
    actions:
      auto_merge: true
      require_approval: false
      label: "codex:lite"
  
  # Medium risk - standard review
  medium:
    conditions:
      - runtime_code_changed: true
      - file_count_max: 10
      - lines_changed_max: 500
      - no_security_files: true
    actions:
      auto_merge: false
      require_approval: true
      approvers_required: 1
      label: "codex:autonomous"
  
  # High risk - requires manual approval
  high:
    conditions:
      - any_of:
          - security_files_changed: true
          - config_files_changed: true
          - file_count_exceeds: 10
          - lines_changed_exceeds: 500
          - multiple_modules_changed: true
    actions:
      auto_merge: false
      require_approval: true
      approvers_required: 2
      require_maintainer: true
      label: "codex:full"

# -----------------------------------------------------------------------------
# Label Definitions
# -----------------------------------------------------------------------------
# Labels used by the pipeline for workflow control

labels:
  # Trigger labels
  triggers:
    - name: "ai-task"
      description: "Triggers the task-runner workflow"
    - name: "codex:run"
      description: "Execute Codex on this PR/issue"
  
  # Risk tier labels
  risk_tiers:
    - name: "codex:lite"
      description: "Low risk - auto-merge eligible"
      color: "0e8a16"
    - name: "codex:autonomous"
      description: "Medium risk - standard review"
      color: "fbca04"
    - name: "codex:full"
      description: "High risk - manual approval required"
      color: "d93f0b"
  
  # Status labels
  status:
    - name: "automated"
      description: "Generated by AI pipeline"
    - name: "promotion"
      description: "Branch promotion PR"
    - name: "requires-approval"
      description: "Needs manual approval"

# -----------------------------------------------------------------------------
# Guardrails
# -----------------------------------------------------------------------------
# Security and quality gates that must pass

guardrails:
  security:
    # Block any commit containing secret patterns
    block_secret_patterns: true
    patterns:
      - 'AKIA[0-9A-Z]{16}'                    # AWS Access Key
      - 'AIzaSy[0-9A-Za-z\-_]{35}'            # Google API Key
      - '-----BEGIN .* PRIVATE KEY-----'      # Private keys
      - 'sk-[A-Za-z0-9]{20,}'                 # OpenAI API Key
      - 'xox[baprs]-[0-9A-Za-z-]{10,}'        # Slack tokens
      - 'ghp_[A-Za-z0-9]{36}'                 # GitHub PAT
      - 'glpat-[A-Za-z0-9\-]{20}'             # GitLab PAT
    
    # Require security scan to pass
    require_security_scan: true
    
    # Scan dependencies for vulnerabilities
    scan_dependencies: true
    fail_on_critical: true
    fail_on_high: false  # Warn only
  
  quality:
    # Code quality requirements
    require_lint_pass: true
    require_typecheck: true
    require_tests: true
    
    # Coverage requirements (if tooling exists)
    min_coverage: 0  # Disabled for now
    
    # PR requirements
    require_description: true
    require_linked_issue: false
  
  deployment:
    # Production deployment gates
    require_staging_first: true
    require_approval_for_production: true
    
    # Health check configuration
    health_check_timeout_seconds: 300
    health_check_retries: 3
    
    # Rollback configuration
    auto_rollback_on_failure: true
    rollback_window_minutes: 30

# -----------------------------------------------------------------------------
# Human-in-the-Loop Triggers
# -----------------------------------------------------------------------------
# Conditions that always require human review, regardless of risk level

human_review_required:
  # Path-based triggers
  paths:
    - "backend/edge-worker/src/routes/**"     # API routes
    - "shared/schemas/**"                      # Data schemas
    - "backend/edge-worker/src/middleware/**"  # Auth middleware
    - ".github/workflows/**"                   # CI/CD config
  
  # Size-based triggers
  thresholds:
    file_count: 10
    lines_changed: 500
    new_dependencies: 1
  
  # Content-based triggers
  patterns:
    - modifies_auth: true
    - modifies_security_config: true
    - modifies_deployment_config: true
    - adds_external_api_call: true

# -----------------------------------------------------------------------------
# Rate Limits
# -----------------------------------------------------------------------------
# Cost and resource controls

rate_limits:
  # Task execution limits
  tasks:
    per_hour: 20
    per_day: 100
  
  # Deployment limits
  deployments:
    per_hour: 5
    per_day: 20
  
  # Preview environment limits
  preview_environments:
    max_concurrent: 5
    auto_cleanup_hours: 24
  
  # API call limits (for OpenAI)
  api_calls:
    per_minute: 30
    per_hour: 500
    max_tokens_per_request: 8192

# -----------------------------------------------------------------------------
# Branch Strategy
# -----------------------------------------------------------------------------
# Defines the branch promotion flow

branches:
  development:
    name: "dev"
    auto_deploy: true
    environment: "development"
  
  staging:
    name: "staging"
    auto_deploy: true
    environment: "staging"
    requires_from: "dev"
  
  production:
    name: "main"
    auto_deploy: false  # Requires approval
    environment: "production"
    requires_from: "staging"
    requires_approval: true
    approvers_required: 2

# -----------------------------------------------------------------------------
# Subagent Configuration
# -----------------------------------------------------------------------------
# Configuration for specialized subagents

subagents:
  ci_reviewer:
    trigger_on: "preflight_failure"
    max_iterations: 3
    prompt_file: ".ai/SUBAGENTS/ci-reviewer.md"
  
  security_linter:
    trigger_on: "security_scan_failure"
    max_iterations: 2
    prompt_file: ".ai/SUBAGENTS/security-linter.md"
    block_on_critical: true
  
  cloudflare_auditor:
    trigger_on: "deployment_failure"
    max_iterations: 2
    prompt_file: ".ai/SUBAGENTS/cloudflare-auditor.md"
  
  route_verifier:
    trigger_on: "staging_deployment"
    prompt_file: ".ai/SUBAGENTS/route-verifier.md"
