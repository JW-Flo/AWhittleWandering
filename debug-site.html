<!DOCTYPE html>
<html>
<head>
    <title>Debug AWhittleWandering</title>
</head>
<body>
    <h1>Debug Site</h1>
    <div id="results"></div>
    
    <script>
        async function debugSite() {
            const results = document.getElementById('results');
            
            // Test data loading
            try {
                const response = await fetch('https://awhittlewandering.com/data/processed_telemetry.json');
                const data = await response.json();
                results.innerHTML += `<p>✅ Static data loaded: ${data.totalMiles} miles, ${data.statesVisited} states</p>`;
            } catch (error) {
                results.innerHTML += `<p>❌ Static data failed: ${error.message}</p>`;
            }
            
            // Test Tessie API (via secure server-side endpoint)
            try {
                const tessieResponse = await fetch('/api/tessie/vehicles');
                if (tessieResponse.ok) {
                    const vehicles = await tessieResponse.json();
                    results.innerHTML += `<p>✅ Tessie API working: ${vehicles.length} vehicles</p>`;
                } else {
                    results.innerHTML += `<p>⚠️ Tessie API returned ${tessieResponse.status}</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p>❌ Tessie API failed: ${error.message}</p>`;
            }

            // Replace with your Mapbox token from environment variables or a secure source
            const mapboxToken = 'YOUR_MAPBOX_TOKEN';
            if (mapboxToken && mapboxToken.startsWith('pk.')) {
                results.innerHTML += `<p>✅ Mapbox token present and valid format</p>`;
            } else {
                results.innerHTML += `<p>❌ Mapbox token missing or invalid</p>`;
            }
        }
        
        debugSite();
    </script>
</body>
</html>
