<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug A Whittle Wandering</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1e293b; 
            color: #f1f5f9; 
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background-color: #065f46; }
        .error { background-color: #7f1d1d; }
        .info { background-color: #1e3a8a; }
        pre { 
            background: #0f172a; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-x: auto; 
            font-size: 12px;
        }
        #root { 
            border: 2px dashed #475569; 
            min-height: 100px; 
            padding: 20px; 
            margin: 20px 0; 
        }
    </style>
</head>
<body>
    <h1>🚗 A Whittle Wandering - Debug Mode</h1>
    
    <div class="status info">
        <strong>Status:</strong> Initializing debug checks...
    </div>

    <div id="api-test">
        <h3>📡 API Connectivity Test</h3>
        <div id="api-result">Testing...</div>
    </div>

    <div id="console-logs">
        <h3>🐛 Console Errors</h3>
        <pre id="error-log">No errors yet...</pre>
    </div>

    <div id="root-container">
        <h3>⚛️ React Mount Point</h3>
        <div id="root"></div>
    </div>

    <!-- Load the CSS first -->
    <link rel="stylesheet" crossorigin href="/assets/components-Bh_1FTD-.css">
    <link rel="stylesheet" crossorigin href="/assets/index-Wy4jP4CZ.css">

    <script>
        // Capture console errors
        const originalError = console.error;
        const originalLog = console.log;
        const errorLog = document.getElementById('error-log');
        let errors = [];

        console.error = function(...args) {
            errors.push('ERROR: ' + args.join(' '));
            errorLog.textContent = errors.join('\n');
            originalError.apply(console, args);
        };

        console.log = function(...args) {
            errors.push('LOG: ' + args.join(' '));
            errorLog.textContent = errors.join('\n');
            originalLog.apply(console, args);
        };

        // Test API connectivity
        async function testAPI() {
            const result = document.getElementById('api-result');
            try {
                const response = await fetch('https://awhittlewandering-api.kd8jc7v8cd.workers.dev/api/v1/unified-data');
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = '<div class="status success">✅ API is working! Response size: ' + JSON.stringify(data).length + ' bytes</div>';
                } else {
                    result.innerHTML = '<div class="status error">❌ API returned ' + response.status + '</div>';
                }
            } catch (error) {
                result.innerHTML = '<div class="status error">❌ API failed: ' + error.message + '</div>';
            }
        }

        // Window error handler
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            errors.push('WINDOW ERROR: ' + msg + ' at ' + url + ':' + lineNo);
            errorLog.textContent = errors.join('\n');
        };

        window.addEventListener('unhandledrejection', function(event) {
            errors.push('UNHANDLED PROMISE REJECTION: ' + event.reason);
            errorLog.textContent = errors.join('\n');
        });

        // Test API
        testAPI();

        // Check if root div exists
        const rootDiv = document.getElementById('root');
        if (rootDiv) {
            errors.push('✅ Root div found');
        } else {
            errors.push('❌ Root div NOT found');
        }
        errorLog.textContent = errors.join('\n');

        // Monitor root div for changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.target === rootDiv) {
                    errors.push('🔄 Root div content changed: ' + (rootDiv.innerHTML ? 'Content added' : 'Content cleared'));
                    errorLog.textContent = errors.join('\n');
                }
            });
        });

        if (rootDiv) {
            observer.observe(rootDiv, { childList: true, subtree: true });
        }
    </script>

    <!-- Load React assets -->
    <script type="module" crossorigin src="/assets/react-vendor-6s76OEBy.js"></script>
    <script type="module" crossorigin src="/assets/ui-vendor-Ck6e1S8a.js"></script>
    <script type="module" crossorigin src="/assets/hooks-utils-DQ4LeGiP.js"></script>
    <script type="module" crossorigin src="/assets/map-vendor-CbRqgjhq.js"></script>
    <script type="module" crossorigin src="/assets/components-05urolId.js"></script>
    <script type="module" crossorigin src="/assets/index-BbRoVRvU.js"></script>

    <script>
        // Give it a few seconds then report status
        setTimeout(() => {
            const rootContent = document.getElementById('root').innerHTML;
            if (rootContent.trim()) {
                errors.push('✅ React has rendered content!');
            } else {
                errors.push('❌ React failed to render - root div is still empty');
            }
            errorLog.textContent = errors.join('\n');
        }, 3000);
    </script>
</body>
</html>
