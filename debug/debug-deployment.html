<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Latest Deployment</title>
</head>
<body>
    <h1>Debugging Latest Deployment</h1>
    <p>Check the console for any JavaScript errors from the latest deployment.</p>
    
    <iframe 
        id="deploymentFrame" 
        src="https://6797e30b.awhittlewandering-site.pages.dev/" 
        width="100%" 
        height="600"
        style="border: 1px solid #ccc;"
        title="A Whittle Wandering Deployment Debug View">
    </iframe>
    
    <script>
        // Capture console errors
        window.addEventListener('error', function(e) {
            console.error('Window Error:', e.error?.message || e.message, e.error?.stack || e.filename + ':' + e.lineno);
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled Promise Rejection:', e.reason);
        });
        
        // Also check iframe errors
        document.getElementById('deploymentFrame').addEventListener('load', function() {
            try {
                const iframeWindow = this.contentWindow;
                if (iframeWindow) {
                    iframeWindow.addEventListener('error', function(e) {
                        console.error('Iframe Error:', e.error?.message || e.message);
                    });
                }
            } catch (e) {
                console.warn('Cannot access iframe due to CORS policy:', e instanceof Error ? e.message : 'Cross-origin restrictions');
                // This is expected behavior for cross-origin iframes
            }
        });
        
        // Monitor console
        console.log('Debugging deployment: https://6797e30b.awhittlewandering-site.pages.dev/');
        console.log('If the iframe loads properly, the issue might be domain-specific.');
    </script>
</body>
</html>
