name: ci
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install scanners
        run: |
          pip install pytest pytest-cov bandit
          curl -L https://github.com/returntocorp/semgrep/releases/latest/download/semgrep-linux-amd64 -o /usr/local/bin/semgrep && chmod +x /usr/local/bin/semgrep
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Python deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Node deps
        run: |
          if [ -f package.json ]; then npm ci || npm install; fi
      - name: Lint & Tests
        run: bash scripts/agentOps.sh lint_test
      - name: Security Scans
        run: bash scripts/agentOps.sh scan
