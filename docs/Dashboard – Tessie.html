  <style>
    html,
    body {
      height: 100%;
      width: 100%;
      background-color: #fafafa;
      color: #333;
      margin: 0;
      font-family: Helvetica, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      display: flex;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #loading-screen img {
      margin-bottom: 30px;
      filter: invert(23%) sepia(52%) saturate(513%) hue-rotate(177deg) brightness(89%) contrast(85%);
    }

    .loading-bar-container {
      height: 2px;
      width: 400px;
      background-color: rgba(100, 100, 100, 0.15);
      position: relative;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 50%;
      background-color: rgba(51, 70, 102, 1);
      position: absolute;
      left: -50%;
      animation: loading 1.2s ease-in-out 0s infinite;
    }

    #loading-screen.is-dark {
      background-color: #19191C;
      color: #fff;
    }

    #loading-screen.is-dark img {
      filter: invert(100%) sepia(100%) saturate(14%) hue-rotate(212deg) brightness(104%) contrast(104%);
    }

    #loading-screen.is-dark .loading-bar {
      background-color: #ffffff;
    }

    @keyframes loading {
      0% {
        transform: translateX(0)
      }

      to {
        transform: translateX(350%)
      }
    }

  <script>
    function handleDarkModeIcon(e) {
      const isDarkMode = e.matches;

      const favicons = document.querySelectorAll('link[rel="icon"]');

      if (isDarkMode) {
        for (const element of favicons) {
          element.href = element.href.replace('light', 'dark');
        }
      } else {
        for (const element of favicons) {
          element.href = element.href.replace('dark', 'light');
        }
      }
    }

    const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

    handleDarkModeIcon(darkModeMediaQuery);

    darkModeMediaQuery.addListener(handleDarkModeIcon);

    const themeMode = window.localStorage.getItem('flutter.theme_mode');

    if (!themeMode || themeMode === '"dark"') {
      document.getElementById('loading-screen').classList.add('is-dark');
    }
  </script>
