name: Streamlined Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type to run"
        required: true
        default: "critical"
        type: choice
        options:
          - critical
          - all
          - api
          - components

jobs:
  # Always run critical tests first
  critical-tests:
    name: Critical Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./awhittlewandering/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./awhittlewandering

      - name: Install jsdom for tests
        working-directory: ./awhittlewandering
        run: npm install jsdom --save-dev

      - name: Check dependencies
        run: |
          if grep -q "@cloudflare/workerd-builder" package.json; then
            echo "ERROR: @cloudflare/workerd-builder dependency still present in package.json!"
            exit 1
          else
            echo "✓ Dependencies check passed"
          fi
        working-directory: ./awhittlewandering

      - name: Run critical tests
        run: npm run test:critical
        working-directory: ./awhittlewandering

  # Only run additional tests if requested or on main branch
  additional-tests:
    name: Non-Critical Tests
    runs-on: ubuntu-latest
    needs: critical-tests
    if: github.event.inputs.test_type == 'all' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    continue-on-error: true # Don't fail workflow on non-critical test failures
    strategy:
      matrix:
        test-suite: [api, components]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./awhittlewandering/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./awhittlewandering

      - name: Install jsdom for tests
        working-directory: ./awhittlewandering
        run: npm install jsdom --save-dev

      - name: Run ${{ matrix.test-suite }} tests
        run: npm run test:${{ matrix.test-suite }}
        working-directory: ./awhittlewandering
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.test-suite }}
          path: ./awhittlewandering/test-report-*.txt
          retention-days: 7

  # Generate comprehensive test report
  test-report:
    name: Generate Test Report
    needs: [critical-tests, additional-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate final report
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical Tests**: ${{ needs.critical-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Additional Tests**: ${{ needs.additional-tests.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Ready**: ${{ needs.critical-tests.result == 'success' && '✅ Yes' || '❌ No' }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.critical-tests.result }}" = "success" ]; then
            echo "🚀 **Deployment can proceed** - Critical tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "🛑 **Deployment blocked** - Critical tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.additional-tests.result }}" = "failure" ]; then
            echo "⚠️ **Note**: Some non-critical tests failed but won't block deployment" >> $GITHUB_STEP_SUMMARY
          fi
