# Wrangler configuration for the dispatch worker
name = "aww-dispatch"
main = "./workers/dispatch.ts"
compatibility_date = "2025-06-15"

# Environment variables
[vars]
APP_NAME = "A Whittle Wandering"
ENABLE_ROUTING = "true"
DEBUG_MODE = "false"

# KV Namespace for routing data
kv_namespaces = [
  { binding = "ROUTING_DATA", id = "KXXXXXXXXXXXXXXXXXXXXXXXX" }
]

# Route to match
routes = [
  { pattern = "dispatch.awhittlewandering.com", custom_domain = true },
  { pattern = "dispatch.awhittlewandering.com/*", custom_domain = true }
]
