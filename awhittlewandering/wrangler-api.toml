# Wrangler configuration for the API worker
name = "aww-api"
main = "./workers/api.ts"
compatibility_date = "2025-06-15"

# Environment variables
[vars]
TESSIE_API_TOKEN = "${TESSIE_API_TOKEN}"
APP_NAME = "A Whittle Wandering"
ENABLE_CACHING = "true"
CACHE_TTL = "300"
RATE_LIMIT_PER_MINUTE = "60"

# KV Namespace for trip data
kv_namespaces = [
  { binding = "TRIP_DATA", id = "KXXXXXXXXXXXXXXXXXXXXXXXX" }
]

# Route to match
routes = [
  { pattern = "api.awhittlewandering.com", custom_domain = true },
  { pattern = "api.awhittlewandering.com/*", custom_domain = true }
]
