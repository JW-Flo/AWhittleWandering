# Wrangler configuration for the browser worker
name = "aww-browser"
main = "./workers/browser.ts"
compatibility_date = "2025-06-15"

# Environment variables
[vars]
APP_NAME = "A Whittle Wandering"
ENABLE_ANALYTICS = "true"
DEBUG_MODE = "false"

# Durable Objects
durable_objects = [
  { binding = "AGENT_MESSAGING", class_name = "AgentMessagingDurableObject" }
]

# Route to match
routes = [
  { pattern = "browser.awhittlewandering.com", custom_domain = true },
  { pattern = "browser.awhittlewandering.com/*", custom_domain = true }
]
