App Info
Your road-trip iOS app is your “mission-control” for the 60-day, 48-state journey.  It passively logs every stop, keeps the dog-friendly cabin cool, knows exactly when/where to charge, surfaces alerts before problems bite, and sends a cryptographically-signed telemetry stream to your Cloudflare Worker so the whole system works even when Starlink is the only link left.

Below is the complete functional spec, organised by responsibility.  Every bullet is mapped to the Apple or Cloudflare API that delivers it, with references so your AI agents (or human teammates) can drop to source when they implement.

⸻

1 Continuous location & visit logging

What it does	Key APIs / libs	Notes
Logs every arrival/departure event (city parks, Superchargers, camp sites).	CLLocationManager.startMonitoringVisits() ⟶ CLVisit events  ￼	Runs in the background with almost zero battery.
Buffers visits in memory & CoreData until uplink is available.	Async Visit struct → CoreData; Combine/async publisher pattern  ￼ ￼	
Uploads in background every ≈ 15 min even if app is closed.	BGTaskScheduler ( BGAppRefreshTask )  ￼ ￼	Apple-approved background cadence; survives reboots.
Signs each POST to the Worker with HMAC-SHA256(body, EDGE_HMAC_KEY) in header X-Sig.	CryptoKit on device, verified server-side in Worker sample  ￼	


