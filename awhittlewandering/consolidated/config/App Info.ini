4 User-facing UI & daily workflow

Dashboard (home tab)
	•	Today’s legs: mileage, target SoC at next stop, ETA.
	•	Dog-mode watch: shows current cabin temp & battery drain estimate.
	•	Alerts feed:
	•	Arrival < 20 % SoC or heat index > 95 °F triggers red card.
	•	Road-closure (ingested via curated RSS) triggers yellow card.

Map tab
	•	Offline vector tiles; highlights mandatory scenic byways and Superchargers.
	•	Pin clusters coloured by charge confidence (green ≥ 30 % buffer, amber 20 – 30 %, red < 20 %).

People tab
	•	Countdown & calendar for every friend/family anchor stop (uses BGTask to prompt “Send ETA to Troy” 6 h out).

