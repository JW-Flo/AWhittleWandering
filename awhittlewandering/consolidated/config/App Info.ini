6 Security & privacy guarantees
	•	All telemetry signed client-side; Worker rejects anything lacking correct HMAC  ￼.
	•	Fleet-API scopes are read-only (vehicle_status, vehicle_location, charging_session, drive_state) – no unlock/remote-start powers  ￼ ￼.
	•	Tokens stored in Cloudflare KV with 256-bit symmetric-key encryption at rest.

⸻

7 Offline & failure-mode behaviour
	•	Zero-network operation for 72 h: charging plan, maps, and friend-stop calendar all cached locally.
	•	If Worker unreachable, app queues visit/SoC batches up to 25 MB, then flushes FIFO when link returns.
	•	If SoC < 10 % and no network, app forces audible alert and shows nearest hard-coded Level-2 fallback list.

