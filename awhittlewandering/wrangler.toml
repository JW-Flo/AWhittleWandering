# Unified Wrangler configuration
# Secrets (CF_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, CF_ZONE_ID, TRIP_DATA_ID, TRIP_DATA_PREVIEW_ID,
# CLOUDFLARE_AI_GATEWAY_TOKEN) are injected by GitHub Actions or `wrangler secret put`.

name          = "continentalusa"
account_id    = "${CLOUDFLARE_ACCOUNT_ID}"
main          = "workers/site.ts"
compatibility_date = "2025-06-29"

# Runtime-safe, non-secret variables available to the Worker
[vars]
MAP_STYLE                     = "mapbox://styles/mapbox/outdoors-v12"
APP_NAME                      = "A Whittle Wandering"
ENABLE_STREAMING              = "true"
ENABLE_MAP_PERFORMANCE_MONITORING = "true"
MAP_RETRY_ATTEMPTS            = "3"
MAP_RETRY_DELAY               = "2000"

# KV namespace (data uploaded separately)
[[kv_namespaces]]
binding     = "TRIP_DATA"
id          = "${TRIP_DATA_ID}"
preview_id  = "${TRIP_DATA_PREVIEW_ID}"

# Optional AI gateway binding; token supplied via secret
[ai]
binding = "AI_GATEWAY"

# Production deployment
[env.production]
[[env.production.routes]]
pattern  = "https://awhittlewandering.com/*"
zone_id  = "${CLOUDFLARE_ZONE_ID}"

# Preview (PR) deployments
[env.preview]
[[env.preview.routes]]
pattern  = "https://preview.awhittlewandering.com/*"
zone_id  = "${CLOUDFLARE_ZONE_ID}"

# Staging environment
[env.staging]
[[env.staging.routes]]
pattern  = "https://staging.awhittlewandering.com/*"
zone_id  = "${CLOUDFLARE_ZONE_ID}"

# Local development
[dev]
port            = 8787
local_protocol  = "http"
upstream_protocol = "https"
