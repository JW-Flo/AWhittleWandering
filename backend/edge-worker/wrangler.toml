name = "awhittlewandering-api"
main = "dist/index.js"
compatibility_date = "2023-10-30"
workers_dev = true

# Cron Triggers for Automated Data Ingestion
[triggers]
crons = [
  "*/15 6-23 * * *",  # Quick state updates (reduced from every 5m to 15m)
  "*/30 * * * *",     # Full sync every 30 minutes
  "0 2 * * *",        # Historical backfill at 2 AM daily
  "5 * * * *",        # Data quality check hourly (offset minute 5)
  "10 */6 * * *"      # AI/ML processing every 6 hours (offset minute 10)
]

# Environment Variables - ZERO FAILURE API MANAGEMENT
[vars]
# All API credentials are stored as SECRETS for security
# Run ./setup-tessie-secrets.sh to configure all required APIs

# Default log level (debug, info, warn, error)
LOG_LEVEL = "info"

# AI Configuration - Using Cloudflare AI Gateway
AI_GATEWAY_ID = "awhittlewandering-ai"
AI_MODEL_NAME = "@cf/meta/llama-3.1-8b-instruct"

# CRITICAL API CONFIGURATION REQUIREMENTS:
# 1. TESSIE_API_TOKEN - Tessie bearer token (HIGHEST PRIORITY)
# 2. MAPBOX_API_TOKEN - Map services and geocoding
# 3. OPENWEATHER_API_KEY - Weather data integration  
# 4. JWT_SECRET - Authentication security (min 32 chars)
# 5. TESLA_VIN - Tesla Vehicle Identification Number

# ⚠️  ALL SECRETS MUST BE CONFIGURED FOR ZERO-FAILURE OPERATION ⚠️
# Use: npx wrangler secret put TESSIE_API_TOKEN
# Use: npx wrangler secret put MAPBOX_API_TOKEN  
# Use: npx wrangler secret put OPENWEATHER_API_KEY
# Use: npx wrangler secret put JWT_SECRET
# Use: npx wrangler secret put TESLA_VIN

# Durable Object migrations (disabled for now)
# [[migrations]]
# tag = "v1"
# new_classes = [ "JourneyTracker" ]

# D1 SQL Database for Tesla data aggregation and caching
# IMPORTANT: Production and development use SEPARATE databases to prevent data corruption
# Global D1 database binding (used by production)
[[d1_databases]]
binding = "TESLA_DB"
database_name = "tesla-journey-tracker"
database_id = "09a6ba85-bd36-4ad3-b5a8-92e230943dcb"

# R2 Object Storage for media files (temporarily disabled)
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "awhittlewandering-media"
# preview_bucket_name = "awhittlewandering-media"

# KV for session/auth tokens and data caching
# Note: The KV namespace in Cloudflare is named "UNIFIED_DATA_CACHE"
[[kv_namespaces]]
binding = "AUTH_TOKENS"
id = "7838e32d8ad04855b13eb2d9aa4f9811"
preview_id = "8063c164a211473498118c9beb57a9b7"

# Analytics Engine for telemetry and performance tracking
[[analytics_engine_datasets]]
binding = "TELEMETRY_ANALYTICS"

# Cloudflare AI for intelligent features
[ai]
binding = "AI"

# Queue for background data processing (disabled for now)
# [[queues.producers]]
# binding = "DATA_PROCESSOR"
# queue = "tesla-data-processor"

# [[queues.consumers]]
# queue = "tesla-data-processor"
# max_batch_size = 10
# max_batch_timeout = 5

# Custom domain configuration (disabled for development)
# [[routes]]
# pattern = "api.awhittlewandering.com/*"
# zone_name = "awhittlewandering.com"

# Development Environment Configuration
[env.development]
name = "awhittlewandering-api-dev"

# Development environment variables
[env.development.vars]
# All API credentials are stored as SECRETS for security in development
# Run ./setup-tessie-secrets.sh to configure all required APIs

# AI Configuration - Using Cloudflare AI Gateway
AI_GATEWAY_ID = "awhittlewandering-ai"
AI_MODEL_NAME = "@cf/meta/llama-3.1-8b-instruct"

# Development D1 Database - uses local SQLite to prevent production data corruption
# For remote dev testing, create a dev database: npx wrangler d1 create tesla-journey-tracker-dev
[[env.development.d1_databases]]
binding = "TESLA_DB"
database_name = "tesla-journey-tracker-dev"
database_id = "local"

# Development R2 bucket (temporarily disabled)
# [[env.development.r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "awhittlewandering-media"

# Development KV for auth tokens
[[env.development.kv_namespaces]]
binding = "AUTH_TOKENS"
id = "7838e32d8ad04855b13eb2d9aa4f9811"

# Development Analytics Engine
[[env.development.analytics_engine_datasets]]
binding = "TELEMETRY_ANALYTICS"

# Cloudflare AI for development
[env.development.ai]
binding = "AI"

[env.production]
name = "awhittlewandering-api"

# Production environment variables - ZERO FAILURE API MANAGEMENT
[env.production.vars]
# AI Configuration - Using Cloudflare AI Gateway
AI_GATEWAY_ID = "awhittlewandering-ai"
AI_MODEL_NAME = "@cf/meta/llama-3.1-8b-instruct"

# Cloudflare AI for production
[env.production.ai]
binding = "AI"
# All API credentials are stored as SECRETS for security
# Run ./setup-tessie-secrets.sh to configure all required APIs

# Production log level can be overridden here
LOG_LEVEL = "info"

# CRITICAL API CONFIGURATION REQUIREMENTS:
# 1. TESSIE_API_TOKEN - Tessie bearer token (HIGHEST PRIORITY)
# 2. MAPBOX_API_TOKEN - Map services and geocoding
# 3. OPENWEATHER_API_KEY - Weather data integration
# 4. JWT_SECRET - Authentication security (min 32 chars)
# 5. TESLA_VIN - Tesla Vehicle Identification Number

# ⚠️  ALL SECRETS MUST BE CONFIGURED FOR ZERO-FAILURE OPERATION ⚠️
# Use: npx wrangler secret put TESSIE_API_TOKEN --env production
# Use: npx wrangler secret put MAPBOX_API_TOKEN --env production
# Use: npx wrangler secret put OPENWEATHER_API_KEY --env production  
# Use: npx wrangler secret put JWT_SECRET --env production
# Use: npx wrangler secret put TESLA_VIN --env production

# Production D1 Database
[[env.production.d1_databases]]
binding = "TESLA_DB"
database_name = "tesla-journey-tracker"
database_id = "09a6ba85-bd36-4ad3-b5a8-92e230943dcb"

# Production R2 bucket (temporarily disabled)
# [[env.production.r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "awhittlewandering-media"

# Production KV for auth tokens
[[env.production.kv_namespaces]]
binding = "AUTH_TOKENS"
id = "7838e32d8ad04855b13eb2d9aa4f9811"

# Production Analytics Engine
[[env.production.analytics_engine_datasets]]
binding = "TELEMETRY_ANALYTICS"

# Production Durable Objects (disabled for now)
# [[env.production.durable_objects.bindings]]
# name = "JOURNEY_TRACKER"
# class_name = "JourneyTracker"

# Production Queue (disabled for now)
# [[env.production.queues.producers]]
# binding = "DATA_PROCESSOR"
# queue = "tesla-data-processor-prod"

# [[env.production.queues.consumers]]
# queue = "tesla-data-processor-prod"
# max_batch_size = 10
# max_batch_timeout = 5

# Production domain routing
[[env.production.routes]]
pattern = "api.awhittlewandering.com/*"
zone_name = "awhittlewandering.com"