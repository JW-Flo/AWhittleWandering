name = "awhittlewandering-api"
main = "dist/worker.js"
compatibility_date = "2024-07-24"

# KV namespace for caching unified data
[[kv_namespaces]]
binding = "UNIFIED_DATA_CACHE"
id = "7838e32d8ad04855b13eb2d9aa4f9811"
preview_id = "8063c164a211473498118c9beb57a9b7"

# R2 bucket for media storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "awhittlewandering-media"

# Temporarily using workers.dev subdomain
# Custom domain configuration for API (disabled until DNS is properly configured)
# [[routes]]
# pattern = "admin-api.awhittlewandering.com/*"
# zone_name = "awhittlewandering.com"

[env.production]
name = "awhittlewandering-api"

# Production KV namespace
[[env.production.kv_namespaces]]
binding = "UNIFIED_DATA_CACHE"
id = "7838e32d8ad04855b13eb2d9aa4f9811"

# Production R2 bucket
[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "awhittlewandering-media"

# Production domain routing (disabled until DNS is properly configured)
# [[env.production.routes]]
# pattern = "admin-api.awhittlewandering.com/*"
# zone_name = "awhittlewandering.com"
