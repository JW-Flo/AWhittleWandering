<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Play a Song for Joe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .widget {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .play-button {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 20px;
        }
        
        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .play-button:active {
            transform: translateY(0);
        }
        
        .play-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .tesla-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .recent-requests {
            margin-top: 30px;
            text-align: left;
        }
        
        .recent-requests h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .request-item {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .request-item .song {
            font-weight: 600;
            color: #333;
        }
        
        .request-item .requester {
            color: #666;
        }
        
        .request-item .status {
            float: right;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #e9ecef;
            color: #495057;
        }
        
        .request-item .status.played {
            background: #d4edda;
            color: #155724;
        }
        
        @media (max-width: 600px) {
            .widget {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="widget">
        <div class="title">🎵 Play a Song for Joe</div>
        <div class="subtitle">Send a song to Joe's Tesla while he's driving!</div>
        
        <div class="tesla-info" id="teslaInfo">
            <div>🚗 <strong>Tesla Status:</strong> <span id="teslaStatus">Checking...</span></div>
            <div>📍 <strong>Location:</strong> <span id="teslaLocation">Loading...</span></div>
            <div>⚡ <strong>Battery:</strong> <span id="teslaBattery">--</span>%</div>
        </div>
        
        <form id="songRequestForm">
            <div class="form-group">
                <label for="songName">🎵 Song Name</label>
                <input type="text" id="songName" placeholder="Enter song title..." required>
            </div>
            
            <div class="form-group">
                <label for="artist">🎤 Artist</label>
                <input type="text" id="artist" placeholder="Enter artist name..." required>
            </div>
            
            <div class="form-group">
                <label for="requestedBy">👤 Your Name</label>
                <input type="text" id="requestedBy" placeholder="Who's sending this?" required>
            </div>
            
            <div class="form-group">
                <label for="message">💬 Message for Joe (optional)</label>
                <textarea id="message" placeholder="Say something nice..." rows="3"></textarea>
            </div>
            
            <button type="submit" class="play-button" id="playButton">
                🎵 Send Song to Joe's Tesla
            </button>
        </form>
        
        <div class="status" id="statusMessage"></div>
        
        <div class="recent-requests" id="recentRequests">
            <h3>🎵 Recent Song Requests</h3>
            <div id="requestsList">Loading...</div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'https://api.awhittlewandering.com';
        
        // Initialize the widget
        document.addEventListener('DOMContentLoaded', function() {
            updateTeslaStatus();
            loadRecentRequests();
            
            // Refresh Tesla status every 30 seconds
            setInterval(updateTeslaStatus, 30000);
            
            // Refresh requests every 60 seconds
            setInterval(loadRecentRequests, 60000);
        });
        
        // Tesla Status Update
        async function updateTeslaStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/vehicle/live`);
                const data = await response.json();
                
                document.getElementById('teslaStatus').textContent = 
                    data.driving.speed > 0 ? '🚗 Driving' : '🅿️ Parked';
                document.getElementById('teslaLocation').textContent = 
                    `${data.location.city}, ${data.location.state}`;
                document.getElementById('teslaBattery').textContent = data.batteryLevel;
                
                // Update form availability
                const isAvailable = data.driving.speed > 0;
                document.getElementById('playButton').disabled = !isAvailable;
                
                if (!isAvailable) {
                    showStatus('info', '🅿️ Joe is parked. Songs will be queued for the next drive!');
                }
                
            } catch (error) {
                document.getElementById('teslaStatus').textContent = 'Connection Error';
                console.error('Failed to get Tesla status:', error);
            }
        }
        
        // Load Recent Requests
        async function loadRecentRequests() {
            try {
                const response = await fetch(`${API_BASE}/api/song-queue`);
                const data = await response.json();
                
                const requestsList = document.getElementById('requestsList');
                if (data.queue.length === 0) {
                    requestsList.innerHTML = '<div class="request-item">No recent requests</div>';
                    return;
                }
                
                requestsList.innerHTML = data.queue.slice(0, 5).map(request => `
                    <div class="request-item">
                        <div class="song">${request.song_name} - ${request.artist}</div>
                        <div class="requester">by ${request.requested_by}</div>
                        <div class="status ${request.status}">${request.status}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                document.getElementById('requestsList').innerHTML = 
                    '<div class="request-item">Failed to load requests</div>';
                console.error('Failed to load requests:', error);
            }
        }
        
        // Handle Song Request Form
        document.getElementById('songRequestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitButton = document.getElementById('playButton');
            const originalText = submitButton.textContent;
            
            submitButton.disabled = true;
            submitButton.textContent = '🎵 Sending...';
            
            try {
                const formData = {
                    songName: document.getElementById('songName').value,
                    artist: document.getElementById('artist').value,
                    requestedBy: document.getElementById('requestedBy').value,
                    message: document.getElementById('message').value
                };
                
                const response = await fetch(`${API_BASE}/api/play-song-for-joe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus('success', result.message);
                    document.getElementById('songRequestForm').reset();
                    loadRecentRequests(); // Refresh the list
                } else {
                    showStatus('error', result.message);
                }
                
            } catch (error) {
                showStatus('error', 'Failed to send song request. Please try again!');
                console.error('Song request failed:', error);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        });
        
        // Show Status Message
        function showStatus(type, message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `status ${type}`;
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            
            // Hide after 5 seconds
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }
        
        // Add some fun animations
        document.querySelector('.title').addEventListener('click', function() {
            this.style.transform = 'scale(1.1)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 200);
        });
    </script>
</body>
</html>
