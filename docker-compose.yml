version: "3.8" # Specify version for better compatibility

services:
  n8n:
    image: n8nio/n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PATH=/
      - N8N_EDITOR_BASE_URL=http://localhost:${N8N_PORT:-5678}
      - DB_TYPE=postgres
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-n8n_password} # Use env var for sensitive data
    volumes:
      - n8n_data:/home/node/.n8n # Use named volume for better portability
    depends_on:
      postgres:
        condition: service_healthy # Ensure postgres is healthy before starting n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped # Better control during manual stops
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - n8n_network

  postgres:
    image: postgres:14.5 # Specify exact version
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${DB_PASSWORD:-n8n_password} # Use same env var for consistency
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - n8n_network

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - HMAC_SECRET=${HMAC_SECRET:-changeme}
      - DB_PATH=/app/data/mcp.sqlite
      - TELEMETRY_BUFFER_PATH=/app/data/telemetry.json
    volumes:
      - ./mcp-server:/app
      - mcp_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - n8n_network

volumes:
  postgres_data:
    name: n8n_postgres_data # Named volume for easier identification
  n8n_data:
    name: n8n_user_data
  mcp_data:
    name: mcp_server_data

networks:
  n8n_network:
    driver: bridge
    name: n8n_internal # Named network for easier identification
