<!DOCTYPE html>
<html>
<head>
    <title>API Debug Test</title>
</head>
<body>
    <h1>API Debug Test</h1>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing API...</p>';
            
            try {
                console.log('Testing vehicle API...');
                const response = await fetch('https://awhittlewandering-edge.kd8jc7v8cd.workers.dev/api/vehicle');
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Vehicle data:', data);
                
                results.innerHTML = `
                    <h2>✅ Success!</h2>
                    <p><strong>Model:</strong> ${data.model}</p>
                    <p><strong>Battery:</strong> ${data.batteryLevel}%</p>
                    <p><strong>Location:</strong> ${data.location.latitude}, ${data.location.longitude}</p>
                    <p><strong>State:</strong> ${data.state}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('API test failed:', error);
                results.innerHTML = `
                    <h2>❌ Error!</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Stack:</strong> ${error.stack}</p>
                `;
            }
        }
        
        // Test immediately
        testAPI();
    </script>
</body>
</html>
