<!doctype html>
<html lang="en">

    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="keywords" content="48 state road trip, Tesla road trip, EV adventure, cross country journey, electric vehicle travel, Shadowfax" />
