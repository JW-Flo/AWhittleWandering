<!DOCTYPE html>
<html lang="en">
<head>
    <title>Journey Data Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .loading { background: #fff3cd; border: 1px solid #ffeaa7; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Journey Data Loading Debug</h1>
    <div id="status"></div>
    <div id="log"></div>
    
    <script>
        let logs = [];
        
        function log(message) {
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            logs.push(`[${timestamp}] ${message}`);
            document.getElementById('log').innerHTML = logs.join('\n');
            console.log(message);
        }
        
        function updateStatus(type, message) {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        // Simulate the exact same loading sequence as the React app
        async function simulateReactAppLoading() {
            log('Starting React app simulation...');
            
            // Initial state
            let vehicleData = null;
            let vehicleError = null;
            let vehicleLoading = true;
            let tripData = null;
            let tripError = null;
            let appError = null;
            
            updateStatus('loading', 'Loading your journey...');
            log('Initial state: loading=true, vehicleData=null, error=null');
            
            // Simulate the error handling logic from App.jsx
            function checkAppError() {
                if (vehicleData) {
                    appError = null;
                    log('App error cleared - we have vehicle data');
                } else if (vehicleError && !vehicleLoading) {
                    appError = vehicleError;
                    log(`App error set: ${vehicleError}`);
                } else {
                    log('App error check: no error conditions met');
                }
                
                // Simulate Dashboard error logic
                const currentError = appError || vehicleError;
                if (currentError) {
                    updateStatus('error', `Unable to load journey data: ${currentError}`);
                    log(`Dashboard showing error: ${currentError}`);
                } else if (vehicleLoading) {
                    updateStatus('loading', 'Loading your journey...');
                } else if (vehicleData) {
                    updateStatus('success', `Journey loaded! Model: ${vehicleData.model}, Battery: ${vehicleData.batteryLevel}%`);
                }
            }
            
            // Simulate API call delay and potential network issues
            log('Simulating vehicle API call...');
            
            try {
                // First, let's see if there's an immediate error condition
                checkAppError();
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const response = await fetch('https://awhittlewandering-edge.kd8jc7v8cd.workers.dev/api/vehicle');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`Vehicle API success: ${JSON.stringify(data, null, 2)}`);
                
                // Update state as React would
                vehicleData = data;
                vehicleError = null;
                vehicleLoading = false;
                
                log('State updated: vehicleData=loaded, vehicleError=null, vehicleLoading=false');
                checkAppError();
                
            } catch (error) {
                log(`Vehicle API error: ${error.message}`);
                
                // Simulate the useVehicleData error handling
                vehicleError = `Network error - using simulated data: ${error.message}`;
                vehicleLoading = false;
                
                // Generate simulated data
                vehicleData = {
                    model: 'Model Y (Simulated)',
                    batteryLevel: 75,
                    state: 'simulated'
                };
                
                log('Simulated data generated due to API error');
                checkAppError();
            }
        }
        
        // Run the simulation
        simulateReactAppLoading();
    </script>
</body>
</html>
