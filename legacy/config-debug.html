<!DOCTYPE html>
<html lang="en">
<head>
    <title>Config Debug</title>
</head>
<body>
    <h1>Configuration Debug</h1>
    <div id="config"></div>
    
    <script type="module">
        // Simulate the same config loading as the app
        const config = {
            api: {
                baseUrl: "https://awhittlewandering-edge.kd8jc7v8cd.workers.dev" || "http://localhost:8787",
                endpoints: {
                    vehicle: "/api/vehicle",
                    weather: "/api/weather", 
                    trip: "/api/trip",
                    stations: "/api/stations",
                    itinerary: "/api/itinerary"
                }
            },
            simulation: {
                enabled: "false" === "true", // This should be false
                updateInterval: 5000
            }
        };
        
        document.getElementById('config').innerHTML = `
            <h2>Effective Configuration:</h2>
            <pre>${JSON.stringify(config, null, 2)}</pre>
            
            <h2>Environment Variables (what the app sees):</h2>
            <p><strong>Simulation Enabled:</strong> ${config.simulation.enabled}</p>
            <p><strong>API Base URL:</strong> ${config.api.baseUrl}</p>
            
            <h2>API Test:</h2>
            <button onclick="testAPI()">Test Vehicle API</button>
            <div id="api-result"></div>
        `;
        
        window.testAPI = async function() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch(config.api.baseUrl + config.api.endpoints.vehicle);
                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>✅ API Success</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Model:</strong> ${data.model}</p>
                    <p><strong>Battery:</strong> ${data.batteryLevel}%</p>
                    <p><strong>State:</strong> ${data.state}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ API Error</h3>
                    <p>${error.message}</p>
                `;
            }
        };
    </script>
</body>
</html>
