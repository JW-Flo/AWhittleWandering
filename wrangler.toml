# =============================================================================
# Root Wrangler Configuration - Workers with Static Assets + SPA Fallback
# =============================================================================
# This configuration is for Cloudflare Workers deployments with static assets.
# SPA routing is handled by src/spa-worker.ts (replaces _redirects to avoid
# Cloudflare error 10021 infinite redirect loop).
#
# For Cloudflare Pages frontend deployment, use frontend/wrangler.toml
# For backend Worker deployment, use backend/edge-worker/wrangler.toml
# =============================================================================

name = "awhittlewandering"
main = "src/spa-worker.ts"
compatibility_date = "2024-01-01"

# Workers static assets configuration
# binding = "ASSETS" gives the Worker access to env.ASSETS.fetch()
# not_found_handling = "none" ensures 404s reach our Worker for SPA fallback
[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "none"

# Note: Backend Worker (awhittlewandering-api) should be deployed separately
# using: cd backend/edge-worker && npx wrangler deploy --env production
