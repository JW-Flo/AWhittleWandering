# =============================================================================
# Root Wrangler Configuration - Workers with Static Assets
# =============================================================================
# This configuration is for Cloudflare Workers deployments with static assets.
# It is NOT used for Cloudflare Pages deployments.
#
# For Cloudflare Pages frontend deployment, use frontend/wrangler.toml
# For backend Worker deployment, use backend/edge-worker/wrangler.toml
#
# The [assets] section below is for Workers static assets serving only.
# Pages deployments use frontend/wrangler.toml with pages_build_output_dir.
# =============================================================================

name = "awhittlewandering"
compatibility_date = "2024-01-01"

# Workers static assets - point to frontend build output
# Note: This [assets] section is for Workers, not Pages
[assets]
directory = "frontend/dist"

# Note: Backend Worker (awhittlewandering-api) should be deployed separately
# using: cd backend/edge-worker && npx wrangler deploy --env production
