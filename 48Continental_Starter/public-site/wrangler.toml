name = "wandering-whittle"
compatibility_date = "2025-06-03"

[site]
bucket = "./dist"

[pages]
pages_build_output_dir = "dist"

[env.production]
name = "wandering-whittle"
routes = ["wandering-whittle.pages.dev/*", "thewanderingwhittle.com/*"]

# SSL/TLS settings for production
[ssl]
always_use_https = true
minimum_tls_version = "1.2"
tls_1_3 = "on"

# Security headers
[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://*; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline';"
