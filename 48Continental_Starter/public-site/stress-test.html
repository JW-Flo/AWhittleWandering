<!DOCTYPE html>
<html>
<head>
    <title>Stress Test</title>
    <script>
        // Performance monitoring
        const metrics = {
            loadTimes: [],
            errors: [],
            successfulLoads: 0,
            failedLoads: 0
        };

        function logMetric(type, data) {
            const timestamp = new Date().toISOString();
            console.log(`[${timestamp}] ${type}:`, data);
            
            switch(type) {
                case 'load':
                    metrics.loadTimes.push(data);
                    metrics.successfulLoads++;
                    break;
                case 'error':
                    metrics.errors.push(data);
                    metrics.failedLoads++;
                    break;
            }

            updateStats();
        }

        function updateStats() {
            const statsElement = document.getElementById('stats');
            if (statsElement) {
                statsElement.innerHTML = `
                    <div>Successful Loads: ${metrics.successfulLoads}</div>
                    <div>Failed Loads: ${metrics.failedLoads}</div>
                    <div>Average Load Time: ${
                        metrics.loadTimes.length 
                        ? (metrics.loadTimes.reduce((a,b) => a + b, 0) / metrics.loadTimes.length).toFixed(2) + 'ms'
                        : 'N/A'
                    }</div>
                `;
            }
        }

        const NUM_SIMULTANEOUS_USERS = 5;
        const REFRESH_INTERVAL = 3000; // 3 seconds

        // Configuration
        const SERVER_PORT = 63344; // Update this if the port changes
        const SERVER_URL = `http://localhost:${SERVER_PORT}`;
        
        function createFrame(userId) {
            const startTime = performance.now();
            const iframe = document.createElement('iframe');

            iframe.onload = () => {
                const loadTime = performance.now() - startTime;
                logMetric('load', loadTime);
            };

            iframe.onerror = (error) => {
                logMetric('error', `Frame ${userId} failed to load: ${error}`);
            };
            iframe.src = SERVER_URL;
            iframe.style.width = '400px';
            iframe.style.height = '500px';
            iframe.style.border = '1px solid #ccc';
            iframe.title = `User ${userId}`;
            
            const container = document.createElement('div');
            container.className = 'frame-container';
            container.innerHTML = `<h3>User ${userId}</h3>`;
            container.appendChild(iframe);
            
            document.getElementById('frames').appendChild(container);
            
            // Simulate user interaction
            setInterval(() => {
                iframe.contentWindow.location.reload();
            }, REFRESH_INTERVAL + Math.random() * 2000); // Add some randomness
        }

        window.onload = () => {
            for (let i = 1; i <= NUM_SIMULTANEOUS_USERS; i++) {
                createFrame(i);
            }
        };
    </script>
    <style>
        #frames {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .frame-container {
            text-align: center;
        }
        h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Stress Testing 5 Simultaneous Users</h1>
    <div id="stats" style="
        background: #f5f5f5;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        font-family: monospace;
    "></div>
    <p>Each frame simulates a different user session with automatic refreshes every ~3 seconds</p>
    <div id="frames"></div>
</body>
</html>
