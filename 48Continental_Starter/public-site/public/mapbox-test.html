<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapbox Token Test</title>
    <!-- Same token meta tag as in index.html -->
    <meta name="mapbox-token" content="pk.eyJ1IjoiaGFyZHdvcmtjbyIsImEiOiJjbWJteHA0cjYwYXRjMm1weGgwdnk5YWw2In0.0Bj4LWRpeefn0qPj_2VHcA">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #info {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            font-family: sans-serif;
            padding: 10px;
            z-index: 1;
            overflow: auto;
            max-height: 300px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
    </style>
    <script>
        // Set token early for testing
        window.__MAPBOX_TOKEN__ = "pk.eyJ1IjoiaGFyZHdvcmtjbyIsImEiOiJjbWJteHA0cjYwYXRjMm1weGgwdnk5YWw2In0.0Bj4LWRpeefn0qPj_2VHcA";
    </script>
</head>
<body>
    <div id="info">
        <h2>Mapbox Token Test</h2>
        <div id="diagnostics">Testing token availability and map loading...</div>
    </div>
    <div id="map"></div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <script>
        // Log container
        const logEl = document.getElementById('diagnostics');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            logEl.appendChild(div);
            console.log(message);
        }
        
        // Run token diagnostics
        function runTokenTest() {
            try {
                const metaToken = document.querySelector('meta[name="mapbox-token"]')?.getAttribute('content');
                const windowToken = window.__MAPBOX_TOKEN__;
                
                log('<strong>Token Sources</strong>');
                log(`Meta tag token: ${metaToken ? '✅ Found' : '❌ Missing'}`);
                log(`Window global token: ${windowToken ? '✅ Found' : '❌ Missing'}`);
                
                // Check token format
                const finalToken = metaToken || windowToken;
                if (!finalToken) {
                    log('❌ No token available from any source!', 'error');
                    return false;
                }
                
                if (!finalToken.startsWith('pk.')) {
                    log(`❌ Token has invalid format: ${finalToken.substring(0, 10)}...`, 'error');
                    return false;
                }
                
                log(`✅ Valid token found: ${finalToken.substring(0, 10)}...`, 'success');
                return finalToken;
            } catch (error) {
                log(`❌ Error during token check: ${error.message}`, 'error');
                return false;
            }
        }
        
        // Initialize map
        function initMap(token) {
            try {
                log('<strong>Map Initialization</strong>');
                
                // Set token
                mapboxgl.accessToken = token;
                log(`✅ Token set on mapboxgl: ${token.substring(0, 10)}...`, 'success');
                
                // Create map
                const map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: [-98.5795, 39.8283],
                    zoom: 3
                });
                
                // Setup event handlers
                map.on('load', () => {
                    log('✅ Map loaded successfully!', 'success');
                    
                    // Add a simple marker
                    new mapboxgl.Marker()
                        .setLngLat([-98.5795, 39.8283])
                        .addTo(map);
                });
                
                map.on('error', (e) => {
                    log(`❌ Map error: ${e.error?.message || 'Unknown error'}`, 'error');
                });
                
            } catch (error) {
                log(`❌ Error initializing map: ${error.message}`, 'error');
            }
        }
        
        // Run the tests
        document.addEventListener('DOMContentLoaded', () => {
            log('Starting Mapbox token tests...');
            const token = runTokenTest();
            if (token) {
                initMap(token);
            }
        });
    </script>
</body>
</html>
