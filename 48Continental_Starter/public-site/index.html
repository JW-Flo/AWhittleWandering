  <link rel="stylesheet" href="styles.css" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <!-- Mapbox token -->
  <meta name="mapbox-token" content="pk.eyJ1IjoidGhld2FuZGVyaW5nd2hpdHRsZSIsImEiOiJjbHQxaXhzejYwYmU2MmpxdHl0MHowN3UzIn0.Q7xKTRlXvtimBHd39JqN1A">

<body>
  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <h1>The Wandering Whittle</h1>
      <p>60 days. 48 states. One Tesla. One epic journey.</p>
      <div class="loader"></div>
    </div>
  </div>

  <!-- Root element for React to mount -->
  <div id="root"></div>

  <!-- Scripts -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <script type="module" src="/src/index.jsx"></script>
  <script>
    // Register service worker for offline functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered successfully', reg))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
