<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A Whittle Wandering – winding road through landscape -->
  <rect width="32" height="32" rx="6" fill="#1a1613"/>
  <!-- Horizon line -->
  <line x1="0" y1="20" x2="32" y2="20" stroke="#3a342a" stroke-width="0.5"/>
  <!-- Winding road -->
  <path d="M16 28 C14 24, 10 22, 12 18 C14 14, 20 16, 18 12 C16 8, 14 6, 16 2"
        stroke="#4ea89b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Road dashes -->
  <path d="M16 28 C14 24, 10 22, 12 18 C14 14, 20 16, 18 12 C16 8, 14 6, 16 2"
        stroke="#c0986a" stroke-width="0.6" fill="none" stroke-linecap="round"
        stroke-dasharray="2 3" opacity="0.7"/>
  <!-- Vanishing point star -->
  <circle cx="16" cy="2.5" r="1.2" fill="#c0986a" opacity="0.8"/>
</svg>
